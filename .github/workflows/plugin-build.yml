# Baut das Plugin „One Mic Drums“ (plugin/OneMicDrums) für macOS (AU + VST3, Universal)
# und Windows (VST3). Die fertigen Plugins liegen danach unter Actions → Lauf → Artifacts.
name: Plugin bauen

on:
  push:
    paths: ['plugin/**', '.github/workflows/plugin-build.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-2022
            name: Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin/OneMicDrums
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOMD_BUILD_TESTS=ON
      - name: Bauen
        run: cmake --build build --config Release --parallel 4
      - name: Messprogramm (erwartet „OMD OK“)
        shell: bash
        run: |
          exe=$(find build -type f \( -name OneMicDrumsTest -o -name OneMicDrumsTest.exe \) | head -1)
          "$exe" out
      - name: Plugins einsammeln
        shell: bash
        run: |
          mkdir -p dist
          find build -type d \( -name '*.vst3' -o -name '*.component' \) -path '*Release*' -prune -exec cp -R {} dist/ \;
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: OneMicDrums-${{ matrix.name }}
          path: plugin/OneMicDrums/dist
