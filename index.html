<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Tech Assistent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tech Assistent">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --surface:#0F1217; --surface-2:#161B23; --field:#07090C; --line:#262D38; --line-strong:#3A4555;
  --ink:#F3F6FA; --muted:#8C97A8; --blue:#3B8BFF; --blue-hi:#B4C6DF; --blue-soft:rgba(59,139,255,.14);
  --green:#86B394; --green-soft:rgba(54,201,126,.16); --red:#CF7F72; --red-soft:rgba(255,91,79,.16);
  --tape:#F2F4F7; --tape-ink:#0B0D10;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(0,0,0,.88);backdrop-filter:blur(10px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:58px}
.bar .t{flex:1;min-width:0}
.bar h1{margin:0;font:600 1.3rem/1.1 "Barlow Condensed",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sub{font-size:.82rem;color:var(--blue-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:none;padding:6px 8px;margin-left:-6px;font:600 1.05rem "Barlow Condensed",sans-serif;cursor:pointer;color:var(--blue-hi)}

main{max-width:760px;margin:0 auto;padding:18px 14px 70px;min-height:calc(100vh - 60px)}
h2{font:700 1.3rem/1.15 "Barlow Condensed",sans-serif;margin:30px 0 10px}
h2 small{font:500 .95rem Barlow,sans-serif;color:var(--muted);margin-left:6px}
.muted{color:var(--muted)}
.foot{color:var(--muted);font-size:.85rem;margin-top:28px;max-width:60ch}

.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font:400 1.3rem/1.15 "Permanent Marker","Comic Sans MS",cursive;padding:8px 18px 7px;transform:rotate(-1.2deg);
  clip-path:polygon(0 6%,3% 0,40% 5%,97% 0,100% 8%,98% 52%,100% 94%,96% 100%,55% 95%,3% 100%,0 92%,2% 48%)}
.tape.big{font-size:1.9rem;padding:10px 22px 9px}
.tape.sm{font-size:1rem;padding:5px 12px 4px}
.tape.tilt{transform:rotate(1deg)}

/* square artist buttons */
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sq{all:unset;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;padding:16px;border-radius:22px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);position:relative;overflow:hidden}
.sq:hover{border-color:var(--blue)}
.sq:focus-visible{outline:2px solid var(--blue-hi);outline-offset:3px}
.sq-ini{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 1.3rem "Barlow Condensed",sans-serif}
.sq-name{font:700 1.35rem/1.1 "Barlow Condensed",sans-serif;word-break:break-word}
.sq-meta{font-size:.82rem;color:var(--muted)}
.sq.add{background:transparent;border:1.5px dashed var(--line-strong);justify-content:center;align-items:center;text-align:center;gap:6px}
.sq.add:hover{border-color:var(--blue)}
.sq-plus{font:300 2.6rem/1 Barlow,sans-serif;color:var(--blue-hi)}

.modes{display:grid;gap:14px}
.mode{all:unset;cursor:pointer;border-radius:22px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.mode::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;border:16px solid var(--blue-soft)}
.mode:hover{border-color:var(--blue)}
.mode:focus-visible{outline:2px solid var(--blue-hi);outline-offset:3px}
.mode b{font:700 2.4rem/1 "Barlow Condensed",sans-serif}
.mode span{color:var(--muted)}
.mode em{font-style:normal;color:var(--blue-hi);font-size:.9rem;font-weight:600}

.tiles{display:grid;gap:10px;margin-top:20px}
.tile{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tile:hover{border-color:var(--blue)}
.tile:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
.tile b{font:700 1.6rem/1 "Barlow Condensed",sans-serif}
.tile span{grid-column:1;color:var(--muted);font-size:.95rem}
.tile i{grid-row:1/3;grid-column:2;font-style:normal;font:600 1.6rem "Barlow Condensed",sans-serif;color:var(--blue-hi)}
.tile.primary{background:var(--blue);border-color:var(--blue)}
.tile.primary span,.tile.primary i{color:#fff;opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.list-item{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;position:relative}
.list-item::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--blue)}
.list-item:hover{border-color:var(--blue)}
.list-item:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
.list-item b{display:block;font:600 1.2rem/1.2 "Barlow Condensed",sans-serif}
.list-item span{color:var(--muted);font-size:.92rem}
.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:18px;color:var(--muted);text-align:center;margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px}
input::placeholder,textarea::placeholder{color:#566173}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.with-btn{display:flex;gap:6px}
.with-btn input{flex:1;min-width:0}

.btn{border:1px solid var(--ink);background:transparent;border-radius:10px;padding:9px 15px;font:600 1rem/1.1 "Barlow Condensed",sans-serif;letter-spacing:.02em;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--blue-hi);color:var(--blue-hi)}
.btn.solid{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.solid:hover{background:#2F7BEF;color:#fff}
.btn.ghost{border-color:var(--line-strong);color:var(--muted)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:6px 10px;min-height:36px;font-size:.95rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;min-width:0}
.x{border:1px solid var(--line);background:var(--field);border-radius:8px;width:40px;min-height:40px;cursor:pointer;color:var(--muted);font-size:1.05rem;flex:none}
.x:hover{color:var(--red);border-color:var(--red)}
.x.sm{width:32px;min-height:32px;font-size:.9rem}

.drum-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.mic-row{display:grid;grid-template-columns:1fr 1.3fr auto;gap:6px;margin-bottom:6px}

/* head picker */
.pick-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:42px;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}
.pick-btn:hover,.pick-btn[aria-expanded="true"]{border-color:var(--blue)}
.pick-btn .ph{color:#566173}
.pick-btn i{font-style:normal;color:var(--blue-hi);transition:transform .15s}
.pick-btn[aria-expanded="true"] i{transform:rotate(180deg)}
.pick-panel{margin-top:6px;border:1px solid var(--blue);border-radius:10px;background:var(--surface-2);padding:10px}
.pick-title{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.linkbtn{border:0;background:none;color:var(--blue-hi);cursor:pointer;padding:2px 0;font-weight:600}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.pick-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.pick-opt{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.pick-opt:hover,.pick-opt.on{border-color:var(--blue);background:var(--blue-soft)}
.pick-opt.brand{font:600 1.1rem "Barlow Condensed",sans-serif;text-align:center}

/* recording chain */
details.chain{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.chain[open]{border-color:var(--line-strong)}
details.chain summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
details.chain summary::-webkit-details-marker{display:none}
.ch-name{font:600 1.2rem "Barlow Condensed",sans-serif;display:flex;justify-content:space-between}
.ch-name::after{content:"+";color:var(--blue-hi)}
details[open] .ch-name::after{content:"–"}
.ch-sum{color:var(--blue-hi);font-size:.88rem}
.ch-body{padding:0 14px 14px}
.flow{display:flex;flex-direction:column;gap:0;margin-top:12px}
.stage-blk{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.flow .arrow{align-self:center;color:var(--blue);line-height:1;padding:4px 0;font-size:1.1rem}
.stage-hd{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.stage-hd .seg{order:5;flex-basis:100%;width:max-content;max-width:max-content}
.ch-body,.stage-blk,details.chain{min-width:0}
.stage-hd b{font:600 1.1rem "Barlow Condensed",sans-serif;flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:.82rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* setlists */
.song{display:grid;grid-template-columns:2rem 1fr 4.6rem auto;gap:6px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.song .no{font:700 1.3rem/42px "Barlow Condensed",sans-serif;color:var(--blue-hi);text-align:right}
.song .note{grid-column:2/4}
.song .ctrl{display:flex;flex-direction:column;gap:4px;grid-row:1/3;grid-column:4}
.song .ctrl button{width:38px;min-height:30px;border:1px solid var(--line);background:var(--field);border-radius:6px;cursor:pointer;color:var(--muted)}
.song .ctrl button:hover{color:var(--blue-hi);border-color:var(--blue)}
.stage{background:#000;color:#fff;position:fixed;inset:0;z-index:20;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 24px)}
.stage ol{margin:0;padding:0;list-style:none;counter-reset:s}
.stage li{counter-increment:s;display:flex;gap:14px;align-items:baseline;font:700 clamp(1.8rem,7vw,3.2rem)/1.15 "Barlow Condensed",sans-serif;padding:6px 0;border-bottom:1px solid #222}
.stage li::before{content:counter(s);color:var(--blue);min-width:1.6em;text-align:right}
.stage li small{display:block;font:500 1.05rem Barlow,sans-serif;color:#9aa}
.stage .close{position:sticky;top:0;float:right;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:700 1.05rem "Barlow Condensed",sans-serif;cursor:pointer}

/* tuner */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 10px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font:600 1.05rem "Barlow Condensed",sans-serif;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:#fff;box-shadow:inset 0 -2px 0 var(--blue)}
.readout{background:radial-gradient(120% 90% at 50% 0%,rgba(59,139,255,.16),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;text-align:center}
.hz{font:700 clamp(4rem,22vw,7rem)/.95 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 28px rgba(59,139,255,.55)}
.hz.stale{color:var(--muted);text-shadow:none}
.hz small{font-size:.3em;font-weight:600;margin-left:4px;color:var(--blue-hi);text-shadow:none}
.notename{font:600 1.1rem "Barlow Condensed",sans-serif;color:var(--muted);min-height:1.5em}
.meter{position:relative;height:44px;margin:14px 2px 6px;border-radius:10px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;left:42%;width:16%;background:var(--green-soft)}
.meter .center{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;opacity:.5}
.meter .needle{position:absolute;top:5px;bottom:5px;width:8px;margin-left:-4px;left:50%;border-radius:4px;background:var(--muted);transition:left .12s ease-out,background .12s}
.meter-labels{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);padding:0 4px}
.status{font:700 1.35rem/1.2 "Barlow Condensed",sans-serif;margin-top:8px;min-height:1.65rem}
.status.ok{color:var(--green)} .status.off{color:var(--red)}
canvas.spec{width:100%;height:120px;display:block;margin-top:12px;border-radius:10px;background:var(--field);border:1px solid var(--line)}
.hits{display:flex;gap:6px;flex-wrap:wrap;min-height:34px}
.hit{font:600 1rem "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.hit.ok{border-color:var(--green);color:var(--green)}
.mic-btn{width:100%;margin-top:12px;min-height:54px;font-size:1.25rem}
.err{color:var(--red);margin-top:8px}
input[type=range]{padding:0;min-height:auto;border:0;background:none;accent-color:var(--blue)}
.lugwrap{display:flex;justify-content:center;margin-top:8px}
.lugwrap svg{width:100%;max-width:340px;height:auto}
.lug{cursor:pointer}
.res-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);text-align:center}
.slot[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.slot b{display:block;font:700 2.2rem/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.slot span{font-size:.82rem;color:var(--muted)}
.slot em{font-style:normal;font-size:.8rem;color:var(--blue-hi)}
.interval{text-align:center;margin-top:12px;font:600 1.15rem "Barlow Condensed",sans-serif}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(120px);background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-weight:600;transition:transform .2s,visibility .2s;z-index:30;max-width:90vw;visibility:hidden}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
@media (prefers-reduced-motion:reduce){.meter .needle,#toast,.pick-btn i{transition:none}}
@media (max-width:420px){.grid{grid-template-columns:1fr}.mic-row{grid-template-columns:1fr 1fr auto}}

/* ===== 3D finish ===== */
input,select,textarea{box-shadow:inset 0 2px 5px rgba(0,0,0,.65)}
.card{background:linear-gradient(180deg,#12161d,#0b0e13);border-color:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 26px rgba(0,0,0,.55)}
.btn{background:linear-gradient(180deg,#262e3a 0%,#141920 100%);border:1px solid rgba(255,255,255,.1);color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.45),0 1px 0 #000,0 6px 16px rgba(0,0,0,.55);
  text-shadow:0 1px 0 rgba(0,0,0,.6);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.15);color:#fff;border-color:rgba(141,187,255,.4)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 #000}
.btn.solid,.btn.solid:hover{background:linear-gradient(180deg,#78B0FF 0%,#3B8BFF 45%,#1C58C6 100%);border-color:#86B9FF;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,10,60,.35),0 1px 0 #000,0 8px 22px rgba(59,139,255,.38)}
.btn.solid:active{box-shadow:inset 0 2px 8px rgba(0,10,60,.5),0 1px 0 #000}
.btn.ghost{color:var(--muted)}
.btn.danger.armed{background:linear-gradient(180deg,#ff8a80,#cf3328);border-color:#ff9a90;color:#fff}
.tile,.sq,.mode,.list-item,.slot{background:linear-gradient(165deg,#1d2430 0%,#0d1117 72%);border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.6),0 2px 0 #000,0 16px 32px rgba(0,0,0,.65);transition:transform .12s,box-shadow .12s,border-color .15s}
.tile:hover,.sq:hover,.mode:hover,.list-item:hover{border-color:rgba(141,187,255,.5)}
.tile:active,.sq:active,.mode:active,.list-item:active{transform:translateY(2px) scale(.995);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 #000,0 4px 10px rgba(0,0,0,.6)}
.tile.primary{background:linear-gradient(165deg,#78B0FF 0%,#3B8BFF 42%,#1A50B5 100%);border-color:#86B9FF;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 #000,0 18px 36px rgba(59,139,255,.35)}
.sq::before,.mode::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 42%);pointer-events:none}
.sq-ini{background:linear-gradient(180deg,#78B0FF,#1F5DCC);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(59,139,255,.4)}
.sq.add{background:transparent;box-shadow:none}
.chip{background:linear-gradient(180deg,#202733,#12161c);border-color:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 8px rgba(0,0,0,.5)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#78B0FF,#2563D6);border-color:#86B9FF;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px rgba(59,139,255,.35)}
.tabs{box-shadow:inset 0 2px 8px rgba(0,0,0,.8)}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#2a3446,#161b24);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 var(--blue),0 3px 8px rgba(0,0,0,.6)}
.pick-btn,.pick-opt,.x,.song .ctrl button{background:linear-gradient(180deg,#1c222c,#0e1218);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 6px rgba(0,0,0,.5)}
.pick-opt.on{background:linear-gradient(180deg,#244a85,#15315c);border-color:var(--blue)}
.readout{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 34px rgba(0,0,0,.6)}
.mode .ico{width:46px;height:46px;color:var(--blue-hi);margin-bottom:auto;filter:drop-shadow(0 4px 10px rgba(59,139,255,.4))}
.mode{min-height:170px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(60% 45% at 50% 42%,rgba(59,139,255,.22),transparent 70%),#000;display:grid;place-items:center;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-inner{text-align:center}
.sp-logo{width:min(46vw,190px);height:auto;filter:drop-shadow(0 0 26px rgba(59,139,255,.45))}
.sp-ring{stroke-dasharray:491;stroke-dashoffset:491;animation:spDraw 1.1s .15s cubic-bezier(.6,0,.2,1) forwards}
.sp-lugs rect{opacity:0;animation:spFade .3s forwards}
.sp-lugs rect:nth-child(1){animation-delay:.85s}.sp-lugs rect:nth-child(2){animation-delay:.92s}.sp-lugs rect:nth-child(3){animation-delay:.99s}.sp-lugs rect:nth-child(4){animation-delay:1.06s}
.sp-lugs rect:nth-child(5){animation-delay:1.13s}.sp-lugs rect:nth-child(6){animation-delay:1.2s}.sp-lugs rect:nth-child(7){animation-delay:1.27s}.sp-lugs rect:nth-child(8){animation-delay:1.34s}
.sp-wave{stroke-dasharray:300;stroke-dashoffset:300;animation:spDraw .8s 1.2s ease-out forwards}
.sp-word{font:700 clamp(2.3rem,11vw,3.4rem)/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;margin-top:20px;opacity:0;transform:translateY(8px);animation:spUp .6s 1.5s forwards;background:linear-gradient(180deg,#fff 30%,#a9bbd4);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-tag{color:var(--blue-hi);margin-top:8px;opacity:0;animation:spUp .6s 1.8s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}} @keyframes spFade{to{opacity:1}} @keyframes spUp{to{opacity:1;transform:none}}
/* drum graphic + string tuner */
.drumwrap{display:flex;justify-content:center;margin:8px 0}
.drumsvg{width:100%;max-width:380px;height:auto;filter:drop-shadow(0 20px 30px rgba(0,0,0,.75))}
.drumsvg .lug{cursor:pointer}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.strings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.str{min-width:52px;min-height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#262e3a,#141920);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 4px 10px rgba(0,0,0,.5);font:700 1.15rem "Barlow Condensed",sans-serif;cursor:pointer;color:var(--ink)}
.str[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 3px var(--blue-soft)}
.str.near{border-color:var(--blue);color:var(--blue-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 14px rgba(59,139,255,.45)}
.str.hot{background:linear-gradient(180deg,#A9CDB3,#1d8a54);color:#fff;border-color:#74e7ad}
.bignote{font:700 clamp(4.5rem,26vw,8rem)/.9 "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 0 30px rgba(59,139,255,.55)}
.bignote.stale{color:var(--muted);text-shadow:none}
.capo{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue-hi);font-weight:600;font-size:.9rem}
.str-row{display:grid;grid-template-columns:6.5rem 1fr;gap:10px;align-items:center;margin-bottom:8px}
.str-no{color:var(--muted);font-weight:500}
.song .tun{grid-column:2/4;display:grid;grid-template-columns:1fr 6.5rem;gap:6px}
.mic-card{padding:10px}
.song .keyrow{grid-column:2/4;display:grid;grid-template-columns:1fr auto auto;gap:6px}
.sheet-ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#171d27,#0b0e13);border:1px solid rgba(255,255,255,.1);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -20px 50px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line-strong);margin:2px auto 12px}
.sheet h3{margin:0;font:700 1.5rem/1.1 "Barlow Condensed",sans-serif}
.sheet .lead{color:var(--blue-hi);margin:4px 0 12px;font-size:.92rem}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--field);border:1px solid var(--line);margin-bottom:8px}
.rec.anchor{border-color:var(--blue)}
.rec .nm{font:600 1.1rem "Barlow Condensed",sans-serif}
.rec .nt{grid-row:1/3;grid-column:2;text-align:right;font:700 1.9rem/1 "Barlow Condensed",sans-serif;color:#fff}
.rec .nt small{display:block;font:500 .82rem Barlow,sans-serif;color:var(--blue-hi);margin-top:3px}
.rec .iv{color:var(--muted);font-size:.85rem}
.rec .fbar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.rec .fbar{height:8px;border-radius:4px;background:#0a0c10;border:1px solid var(--line)}
.rec .fbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#E0322A 0%,#FF7A62 45%,#FFD9D2 75%,#FFFFFF 100%);box-shadow:0 0 10px rgba(255,90,70,.35)}
.rec .cp{color:var(--blue-hi);font-weight:600}
.legend{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin:2px 0 8px}
.legend i{flex:0 0 90px;height:6px;border-radius:3px;background:linear-gradient(90deg,#E0322A,#FF7A62 45%,#fff)}
/* ===== area colours + navigation ===== */
:root{--accent:#3B8BFF}
.bar{border-bottom:2px solid color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 8px 20px -12px color-mix(in srgb,var(--accent) 60%,transparent)}
.back{color:var(--accent)}
.crumbs{display:flex;gap:2px;align-items:center;font-size:.8rem;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{all:unset;cursor:pointer;color:var(--accent);font-weight:600;padding:1px 2px;border-radius:4px}
.crumbs button:focus-visible{outline:2px solid var(--accent)}
.crumbs span{color:var(--muted);padding:0 2px}
main h2{position:relative;padding-left:12px}
main h2::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:4px;border-radius:2px;background:var(--accent)}
.list-item::before{background:var(--accent)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.atile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:138px;padding:16px;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,#161b23) 0%,#0d1117 78%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #000,0 14px 30px rgba(0,0,0,.6);transition:transform .12s,box-shadow .12s}
.atile:active{transform:translateY(2px) scale(.99)}
.atile:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.atile::after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 35%,transparent),transparent 70%)}
.at-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 75%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px color-mix(in srgb,var(--c) 45%,transparent)}
.at-ico svg{width:24px;height:24px}
.atile b{display:block;font:700 1.35rem/1.05 "Barlow Condensed",sans-serif}
.atile small{display:block;color:var(--muted);font-size:.84rem;margin-top:3px}
.mode.colored{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#161b23),#0d1117 75%)}
.mode.colored::after{border-color:color-mix(in srgb,var(--c) 20%,transparent)}
.mode.colored .ico,.mode.colored em{color:var(--c)}
.mode .ico.sm{width:40px;height:40px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(6,8,11,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
#tabbar[hidden]{display:none}
#tabbar button{all:unset;cursor:pointer;flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:12px;color:var(--muted);font:600 .7rem Barlow,sans-serif}
#tabbar button svg{width:24px;height:24px}
#tabbar button[aria-current="page"]{color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
#tabbar button:focus-visible{outline:2px solid var(--c)}
body.has-tabs main{padding-bottom:120px}
body.has-tabs #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
.avg{font:600 1.05rem "Barlow Condensed",sans-serif;margin:4px 0 10px}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}} @keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-ov{animation:none}}
.song .ai{grid-column:1/-1;margin-top:6px;background:linear-gradient(180deg,#141a24,#0b0e13);border:1px solid var(--line-strong);border-radius:14px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.ai-hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ai-meta{font:600 1.1rem "Barlow Condensed",sans-serif;color:var(--blue-hi);margin:12px 0 8px}
.ai-secs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ai-sec{display:grid;grid-template-columns:6.5rem 1fr;gap:2px 10px;padding:9px 11px;border-radius:10px;background:var(--field);border:1px solid var(--line)}
.ai-sec b{font:600 1.02rem "Barlow Condensed",sans-serif;color:var(--muted)}
.ai-ch{font:600 1.12rem "Barlow Condensed",sans-serif;color:#fff;letter-spacing:.02em;word-break:break-word}
.ai-sec small{grid-column:2;color:var(--muted)}
.ai-tip{font-size:.92rem;margin:10px 0 0}
.ai-note{color:var(--muted);font-size:.78rem;margin:8px 0 0}
.pick-group{font:600 .78rem Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-hi);margin:8px 2px 2px}
.pick-group:first-child{margin-top:0}
@media (prefers-reduced-motion:reduce){.sp-ring,.sp-wave{animation:none;stroke-dashoffset:0}.sp-lugs rect,.sp-word,.sp-tag{animation:none;opacity:1;transform:none}.pulse{animation:none}.btn,.tile,.sq,.mode,.list-item{transition:none}}

/* ===== refined, quieter palette ===== */
:root{--blue:#5D84BD;--blue-hi:#B4C6DF;--blue-soft:rgba(93,132,189,.16);--green:#86B394;--green-soft:rgba(134,179,148,.14);--red:#CF7F72;--red-soft:rgba(207,127,114,.14);--accent:#88A3C4}
.bar{border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:none}
.hz,.bignote{text-shadow:none}
.readout{background:linear-gradient(180deg,#15181d,#0d0f13);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 24px rgba(0,0,0,.5)}
input,select,textarea{box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.btn{background:linear-gradient(180deg,#1f242c,#14171c);border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 #000,0 4px 10px rgba(0,0,0,.45);text-shadow:none}
.btn:hover{filter:none;border-color:rgba(255,255,255,.24);color:#fff}
.btn.solid,.btn.solid:hover,.tile.primary{background:linear-gradient(180deg,#6788B8,#4B6B9B);border-color:#7895C0;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 0 #000,0 4px 12px rgba(0,0,0,.45)}
.btn.danger.armed{background:linear-gradient(180deg,#B9685C,#8E4A40);border-color:#C47A6E}
.chip{background:#14171c;box-shadow:none;border-color:rgba(255,255,255,.12)}
.chip[aria-pressed="true"]{background:#273241;border-color:#6F8DB8;color:#E6ECF5;box-shadow:none}
.tabs{box-shadow:inset 0 1px 4px rgba(0,0,0,.6)}
.tabs button[aria-selected="true"]{background:#1d222a;box-shadow:inset 0 -2px 0 var(--accent)}
.pick-btn,.pick-opt,.x,.song .ctrl button{background:#14171c;box-shadow:none}
.pick-opt.on{background:#222b38;border-color:#6F8DB8}
.pick-panel{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:#121418}
.card,.song .ai{background:#101216;box-shadow:none;border-color:rgba(255,255,255,.07)}
.sq,.mode,.list-item,.slot,.tile,.atile,.mode.colored{background:linear-gradient(180deg,#15181d,#0f1115);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 20px rgba(0,0,0,.45)}
.sq::before,.mode::before,.mode::after,.atile::after{display:none}
.sq:hover,.mode:hover,.list-item:hover,.atile:hover{border-color:rgba(255,255,255,.18)}
.sq-ini{background:#20262f;color:var(--blue-hi);box-shadow:none;border:1px solid rgba(255,255,255,.08)}
.sq.add{background:transparent;box-shadow:none;border:1px dashed rgba(255,255,255,.18)}
.mode.colored{border-left:3px solid color-mix(in srgb,var(--c) 75%,transparent)}
.mode.colored:hover{border-color:rgba(255,255,255,.18);border-left-color:var(--c)}
.mode .ico{filter:none}
.mode b{font-size:2.1rem}
.atile{min-height:120px;border-top:2px solid color-mix(in srgb,var(--c) 70%,transparent)}
.atile:hover{border-top-color:var(--c)}
.at-ico{width:40px;height:40px;border-radius:11px;background:transparent;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);box-shadow:none}
.at-ico svg{width:22px;height:22px}
.atile b{font-size:1.28rem}
#tabbar{background:rgba(5,6,8,.96)}
#tabbar button[aria-current="page"]{background:transparent;color:var(--c);box-shadow:inset 0 2px 0 var(--c);border-radius:0 0 10px 10px}
.str{background:#171a20;box-shadow:none}
.str.hot{background:#3E5E48;border-color:var(--green);color:#EAF3EC}
.str.near{box-shadow:none;border-color:#6F8DB8;color:var(--blue-hi)}
.slot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue-soft)}
.sheet{background:#111317;box-shadow:0 -16px 40px rgba(0,0,0,.7)}
.rec{background:#0c0e11}
.rec .fbar i{background:linear-gradient(90deg,#A8382E 0%,#D4887A 45%,#EFDCD4 78%,#FAF7F4 100%);box-shadow:none}
.legend i{background:linear-gradient(90deg,#A8382E,#D4887A 45%,#FAF7F4)}
#splash{background:#000}
.sp-logo{filter:none}
.sp-word{background:linear-gradient(180deg,#F4F2EE 30%,#B9C0C9);-webkit-background-clip:text;background-clip:text}
.drumsvg{filter:drop-shadow(0 14px 22px rgba(0,0,0,.7))}
.capo{background:rgba(136,163,196,.12)}


/* ===== mixing console ===== */
.console-wrap{margin:4px -14px 0;overflow-x:auto;padding:4px 14px 14px;-webkit-overflow-scrolling:touch}
.console{display:inline-flex;align-items:stretch;background:linear-gradient(180deg,#1c1f24,#121418);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 30px rgba(0,0,0,.6)}
.strip{width:74px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 5px 6px;border-right:1px solid rgba(0,0,0,.65);box-shadow:1px 0 0 rgba(255,255,255,.035);transition:opacity .15s}
.strip:last-child{border-right:0;box-shadow:none}
.strip.bus{background:transparent}
.strip.master{width:84px;background:rgba(255,255,255,.035);border-radius:0 8px 8px 0}
.strip.dim{opacity:.4}
.console .sep{width:8px;flex:none}
.ins{width:100%;height:20px;border-radius:4px;background:#0a0b0e;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:3px;padding:0 4px;font:600 10px/1 "Barlow Condensed",sans-serif;overflow:hidden;white-space:nowrap}
.ins i{font-style:normal;color:var(--k);letter-spacing:.04em;flex:none}
.ins span{color:#cfd6df;overflow:hidden;text-overflow:ellipsis}
.ins.empty{opacity:.3}
.knob-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 9px "Barlow Condensed",sans-serif;color:var(--muted);letter-spacing:.1em}
.knob{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4c535e,#1c1f25 70%);box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18);position:relative;touch-action:none;cursor:ns-resize}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:11px;margin-left:-1px;border-radius:1px;background:var(--kc,#ECE6DA);transform-origin:50% 14px;transform:rotate(var(--a,0deg))}
.knob.ro{cursor:default}
.knob:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kval{color:#d9dee6;font-size:10px;letter-spacing:0;font-variant-numeric:tabular-nums}
.ms{display:flex;gap:4px}
.ms button{width:27px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.1);background:#16191e;font:700 10px "Barlow Condensed",sans-serif;color:var(--muted);cursor:pointer}
.ms button.m[aria-pressed="true"]{background:#8E4A40;color:#fff;border-color:#C47A6E}
.ms button.s[aria-pressed="true"]{background:#C4A36E;color:#1a1408;border-color:#d9bd8e}
.dbv{font:600 11px "Barlow Condensed",sans-serif;color:#e9edf3;font-variant-numeric:tabular-nums;background:#0a0b0e;border-radius:3px;padding:2px 5px;min-width:42px;text-align:center}
.fader{position:relative;width:100%;height:210px;touch-action:none;cursor:ns-resize;border-radius:4px}
.fader:focus-visible{outline:2px solid var(--accent)}
.fader .slot{position:absolute;left:58%;top:6px;bottom:6px;width:4px;margin-left:-2px;border-radius:2px;background:#040506;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.05)}
.fader .tick{position:absolute;left:32%;right:16%;height:1px;background:rgba(255,255,255,.09)}
.fader .tick b{position:absolute;left:-20px;top:-6px;width:18px;text-align:right;font:500 8.5px "Barlow Condensed",sans-serif;color:#6c7480}
.fader .tick.zero{background:rgba(255,255,255,.22)}
.fader .cap{position:absolute;left:58%;width:34px;height:22px;margin:-11px 0 0 -17px;border-radius:3px;pointer-events:none;
  background:linear-gradient(180deg,#ece9e3 0%,#c2bdb3 44%,#6f6b64 50%,#c9c4ba 56%,#efece6 100%);box-shadow:0 4px 8px rgba(0,0,0,.65)}
.strip.bus .cap{background:linear-gradient(180deg,#f6e7b0 0%,#dcb658 44%,#6e5820 50%,#dfba5e 56%,#f8ebbb 100%)}
.strip.send .cap{background:linear-gradient(180deg,#d3e2f8 0%,#7ea0d2 44%,#2f4a75 50%,#82a4d6 56%,#d9e6fa 100%)}
.console .ins.empty{margin:0!important;padding:0!important;border:1px solid rgba(255,255,255,.06)!important;background:#0a0b0e!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:4px!important;text-align:left}
.fader .slot{width:4px!important;padding:0!important;border:0!important;border-radius:2px!important;background:#040506!important;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.05)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.strip.master .cap{background:linear-gradient(180deg,#e9b3aa 0%,#c27b70 44%,#6e3a33 50%,#c47f74 56%,#ecbcb3 100%)}
.scribble{width:100%;background:var(--tape);color:var(--tape-ink);font:400 12.5px/1.1 "Permanent Marker","Comic Sans MS",cursive;text-align:center;padding:5px 3px 4px;transform:rotate(-1.5deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;cursor:pointer;
  clip-path:polygon(0 8%,4% 0,50% 6%,96% 0,100% 10%,98% 50%,100% 92%,95% 100%,50% 94%,4% 100%,0 90%,2% 50%)}
.strip:nth-child(even) .scribble{transform:rotate(1.2deg)}
.src{font-size:9px;color:var(--muted);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}


/* ===== kit photo ===== */
.kp-wrap{position:relative;width:fit-content;max-width:100%;margin:0 auto;border-radius:14px;overflow:visible;user-select:none;-webkit-user-select:none}

/* ===== setlist rows + reorder + import ===== */
.song.srow{display:block;padding:0;border-bottom:1px solid var(--line);transition:transform .18s ease;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;background:transparent}
.song.srow .s-ed{-webkit-user-select:text;user-select:text}
.s-head{display:grid;grid-template-columns:2rem 1fr 40px;align-items:center;gap:8px;padding:10px 2px}
.song.srow .no{line-height:1.2}
.s-main{cursor:pointer;min-width:0;border-radius:8px}
.s-main:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.s-title{font:600 1.12rem/1.2 "Barlow Condensed",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bdg.key{color:var(--blue-hi);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.bdg.ai{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.bdg.note{font-weight:500}
.handle{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:1.25rem;cursor:grab;touch-action:none}
.handle:focus-visible{outline:2px solid var(--accent)}
.s-ed{display:flex;flex-direction:column;gap:8px;padding:0 2px 14px 40px}
.s-ed-row{display:grid;grid-template-columns:1fr 5.5rem;gap:8px}
.song.srow .keyrow{grid-column:auto}
.reorder-list > .dragging:not(.song){position:relative;z-index:6;transition:none!important;box-shadow:0 18px 40px rgba(0,0,0,.45)!important}
.reordering .reorder-list > :not(.dragging){transition:transform .16s ease}
.reorder-list > .sq,.reorder-list > .list-item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.song.srow.dragging{z-index:6;transition:none;background:var(--surface-2);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.45);border-bottom-color:transparent}
.song.srow.dragging .handle{cursor:grabbing}
body.reordering{-webkit-user-select:none;user-select:none}
.html-ice .song.srow.dragging,.ice .song.srow.dragging{background:rgba(255,255,255,.9)}
.glass .song.srow.dragging{background:rgba(30,36,48,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.imp-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;margin:10px 0}
.imp-row{display:grid;grid-template-columns:24px 1.6rem 1fr;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
.imp-row input{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--blue)}
.imp-row .n{color:var(--muted);font:600 .9rem "Barlow Condensed",sans-serif;text-align:right}
.imp-row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row .m{grid-column:3;display:flex;gap:5px;flex-wrap:wrap}
.imp-row.off{opacity:.45}
.s-ed .keyrow{grid-column:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.s-ed .keyrow select{grid-column:1/-1}
.s-ed .keyrow .btn{width:100%}

html.glass{--a-tuner:#4D8DFF;--a-quick:#1FC6DA;--a-kits:#FFA62B;--a-chain:#A779FF;--a-sets:#2ED67E;--a-tunings:#FF5C8D;
  --i-drums:#FF6A3D;--i-bass:#8F7CFF;--i-guitar:#1FD1AE;--m-live:#FF4F5E;--m-studio:#3F9BFF}
html.ice{--a-tuner:#2563EB;--a-quick:#0891B2;--a-kits:#D97706;--a-chain:#7C3AED;--a-sets:#16A34A;--a-tunings:#DB2777;
  --i-drums:#E2481F;--i-bass:#6D4FE0;--i-guitar:#0D9488;--m-live:#DC2638;--m-studio:#1D6FE0}
/* icons/text in ice use the darker palette directly */
.ice .back,.ice .crumbs button{color:var(--accent)}
.ice :is(.at-ico,.rc-ico){color:var(--c)}
.ice .mode.colored em,.ice .mode.colored .ico{color:var(--c)}
.ice #tabbar button[aria-current="page"] svg{color:var(--c)}
/* tiles: thinner outlines, calmer corners, more see-through */
:is(.card,.sq,.mode,.mode.colored,.mode.rowcard,.atile,.list-item,.slot,.readout,details.chain,.rec,.kp-info,.song .ai){border-radius:14px}
:is(.sq,.mode,.mode.rowcard,.atile){border-radius:16px}
.list-item{border-radius:12px}
:is(.at-ico,.rc-ico,.sq-ini){border-radius:10px}
.glass :is(.card,.sq,.mode,.mode.colored,.mode.rowcard,.atile,.list-item,.slot,.readout,details.chain,.rec,.kp-info,.song .ai,.tabs),
.ice :is(.card,.sq,.mode,.mode.colored,.mode.rowcard,.atile,.list-item,.slot,.readout,details.chain,.rec,.kp-info,.song .ai,.tabs,.mic-card){border-width:.5px}
.glass :is(.card,.readout,details.chain,.song .ai,.mic-card),.ice :is(.card,.readout,details.chain,.song .ai,.mic-card){border-radius:14px}
.glass :is(.sq,.mode,.mode.rowcard,.atile),.ice :is(.sq,.mode,.mode.rowcard,.atile){border-radius:16px}
.glass .list-item,.ice .list-item{border-radius:12px}
.glass :is(.card,.sq,.mode,.mode.colored,.mode.rowcard,.atile,.list-item,.slot,.readout,details.chain,.rec,.kp-info,.stage-blk,.song .ai,.tabs){
  background:linear-gradient(150deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.012) 45%,rgba(255,255,255,.03) 100%);
  border-color:rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(10px) saturate(150%);backdrop-filter:blur(10px) saturate(150%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.18)}
.glass .mode.colored,.glass .mode.rowcard{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 14%,transparent) 0%,rgba(255,255,255,.012) 55%,rgba(255,255,255,.03) 100%);border-color:color-mix(in srgb,var(--c) 30%,rgba(255,255,255,.12))}
.glass .atile{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 15%,transparent) 0%,rgba(255,255,255,.012) 58%,rgba(255,255,255,.03) 100%);border-color:color-mix(in srgb,var(--c) 32%,rgba(255,255,255,.12))}
.glass :is(.at-ico,.rc-ico){color:var(--c);background:color-mix(in srgb,var(--c) 14%,rgba(255,255,255,.04));border:.5px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:inset 0 .5px 0 rgba(255,255,255,.3)}
.glass .mode.colored .ico{color:var(--c)}
.ice :is(.card,.sq,.mode,.mode.colored,.mode.rowcard,.atile,.list-item,.slot,.readout,details.chain,.rec,.kp-info,.stage-blk,.song .ai,.tabs,.mic-card){
  background:
    linear-gradient(118deg,rgba(255,255,255,0) 52%,rgba(255,255,255,.35) 59%,rgba(255,255,255,0) 66%),
    linear-gradient(150deg,rgba(255,255,255,.34) 0%,rgba(236,246,252,.08) 45%,rgba(214,234,248,.14) 100%);
  border-color:rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(6px) saturate(150%) brightness(1.03);backdrop-filter:blur(6px) saturate(150%) brightness(1.03);
  box-shadow:inset 0 1px .5px rgba(255,255,255,.9),inset 0 -4px 10px rgba(120,170,210,.16),inset 0 0 18px rgba(225,242,255,.28),0 8px 20px rgba(30,60,100,.09),0 22px 44px -24px rgba(30,60,100,.18)}
.ice .atile,.ice .mode.colored{background:
    linear-gradient(118deg,rgba(255,255,255,0) 52%,rgba(255,255,255,.35) 59%,rgba(255,255,255,0) 66%),
    linear-gradient(150deg,rgba(255,255,255,.36) 0%,rgba(236,246,252,.08) 48%,color-mix(in srgb,var(--c) 10%,rgba(214,234,248,.12)) 100%)}
.ice :is(.at-ico,.rc-ico){background:linear-gradient(150deg,rgba(255,255,255,.85),rgba(232,240,248,.45));border:.5px solid #fff}
/* classic theme: thinner colour lines */
html:not(.glass):not(.ice) .atile{border-top-width:1.5px}
html:not(.glass):not(.ice) .mode.colored{border-left-width:2px}
/* vivid fader caps */
.fader .cap{background:linear-gradient(180deg,#ffffff 0%,#d9dde3 44%,#5b6068 50%,#d2d6dc 56%,#f6f7f9 100%)}
.strip.bus .cap{background:linear-gradient(180deg,#ffe58a 0%,#f5b800 44%,#6b4f00 50%,#f2b400 56%,#ffe27a 100%)}
.strip.send .cap{background:linear-gradient(180deg,#a9cbff 0%,#2f7bff 44%,#0d2a66 50%,#3a82ff 56%,#a3c7ff 100%)}
.strip.master .cap{background:linear-gradient(180deg,#ff9a8c 0%,#ef2f1e 44%,#6a0f08 50%,#f0392a 56%,#ff9486 100%)}

/* splash motion: slide in from the right */
.sp-inner{transition:transform .5s cubic-bezier(.7,0,.84,0),opacity .45s ease}
#splash.out .sp-inner{transform:translateX(-28vw);opacity:0}
.sp-logo{animation:spIn 1.05s cubic-bezier(.16,1,.3,1) both}
@keyframes spIn{0%{transform:translateX(75vw) rotate(160deg) scale(.6);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
.sp-ring{animation-delay:.35s}
.sp-wave{animation-delay:1.05s}
.sp-word{display:flex;justify-content:center;opacity:1!important;transform:none!important;animation:none!important;background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#F4F2EE}
.sp-word span{display:inline-block;opacity:0;transform:translateX(46px);animation:spLetter .6s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.7s + var(--i) * .038s)}
@keyframes spLetter{to{opacity:1;transform:none}}
.sp-line{height:2px;width:min(56vw,240px);margin:14px auto 0;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(170,200,255,.9) 50%,transparent);transform:scaleX(0);transform-origin:100% 50%;animation:spLine .8s cubic-bezier(.16,1,.3,1) 1.45s forwards}
@keyframes spLine{to{transform:scaleX(1)}}
.sp-tag{display:none}
@media (prefers-reduced-motion:reduce){.sp-logo,.sp-word span,.sp-line{animation:none!important;opacity:1;transform:none}.sp-inner{transition:opacity .3s}#splash.out .sp-inner{transform:none}}

/* ===== splash: user logo assembles from all sides ===== */
.sp-logo{width:min(38vw,150px);height:auto;filter:drop-shadow(0 0 22px rgba(170,200,255,.25));animation:spHit .55s cubic-bezier(.3,1.6,.5,1) 1.3s both!important;overflow:visible}
@keyframes spHit{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.sp-logo .lg{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation-duration:1s;animation-timing-function:cubic-bezier(.16,1,.3,1);animation-fill-mode:forwards}
.lg-arc{animation-name:lgArc;animation-delay:.1s}
.lg-circle{animation-name:lgCircle;animation-delay:.25s}
.lg-l{animation-name:lgL;animation-delay:.42s}
.lg-r{animation-name:lgR;animation-delay:.52s}
@keyframes lgArc{0%{opacity:0;transform:translateY(-70vh) rotate(-40deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes lgCircle{0%{opacity:0;transform:translateX(-80vw) scale(.4)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes lgL{0%{opacity:0;transform:translate(-60vw,60vh) rotate(-60deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes lgR{0%{opacity:0;transform:translate(60vw,60vh) rotate(60deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.sp-word span{transform:translate(var(--dx,0),var(--dy,0));animation:spLetter2 .65s cubic-bezier(.16,1,.3,1) forwards!important;animation-delay:calc(.95s + var(--i) * .04s)!important}
@keyframes spLetter2{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0))}to{opacity:1;transform:none}}
.sp-line{animation-delay:1.7s!important}
@media (prefers-reduced-motion:reduce){.sp-logo,.sp-logo .lg,.sp-word span{animation:none!important;opacity:1!important;transform:none!important}}
/* home button with logo */
.home-btn svg.logo-ico{width:23px;height:31px}
/* faint full-screen logo watermark on the selection pages */
#wm{position:fixed;inset:0;z-index:-1;pointer-events:none;display:none;place-items:center}
body.wm #wm{display:grid}
#wm svg{width:min(86vw,560px);height:auto;max-height:78vh;color:#fff;opacity:.05}
.ice #wm svg{color:#0b1220;opacity:.06}

/* ===== onboarding ===== */
#onb{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 18px);background:rgba(3,4,7,.94);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:#F4F6FA;animation:fadeIn .3s ease;transition:opacity .3s}
#onb.out{opacity:0}
.ice #onb{background:rgba(236,241,247,.95);color:var(--ink)}
.onb-bars{display:flex;gap:5px}
.onb-bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.ice .onb-bars span{background:rgba(20,30,50,.15)}
.onb-bars i{display:block;height:100%;width:0;background:currentColor;border-radius:2px}
.onb-bars span.done i{width:100%}
.onb-bars span.on i{animation:onbBar 3.6s linear forwards}
@keyframes onbBar{to{width:100%}}
.onb-skip{all:unset;cursor:pointer;align-self:flex-end;margin-top:10px;font-size:.9rem;opacity:.7;padding:6px 4px}
.onb-stage{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.onb-slide{text-align:center;max-width:420px;animation:onbIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes onbIn{from{opacity:0;transform:translateX(30px)}}
.onb-slide h2{font:700 1.7rem/1.15 "Barlow Condensed",sans-serif;margin:26px 0 8px;padding:0}
.onb-slide h2::before{display:none}
.onb-slide p{margin:0 auto;max-width:32ch;opacity:.75;line-height:1.45}
.onb-nav{display:flex;justify-content:space-between;gap:10px}
.onb-nav .btn{flex:1;min-height:50px}
.onb-art{height:230px;display:flex;align-items:center;justify-content:center}
.onb-logo{height:210px;width:auto;color:currentColor}
.onb-logo *{stroke-dasharray:1400;stroke-dashoffset:1400;animation:onbDraw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.onb-logo line{animation-delay:.6s}
@keyframes onbDraw{to{stroke-dashoffset:0}}
.onb-flow{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:6px}
.onb-chip{padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);font:600 1.05rem "Barlow Condensed",sans-serif;opacity:0;animation:onbPop .45s cubic-bezier(.3,1.5,.5,1) var(--d) forwards}
.ice .onb-chip{border-color:#fff;background:rgba(255,255,255,.7)}
.onb-chip:last-child{background:var(--blue);border-color:var(--blue);color:#fff}
.onb-arrow{opacity:0;animation:onbPop .3s ease var(--d) forwards;font-size:1.4rem;opacity:0}
@keyframes onbPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.onb-tuner{flex-direction:column;gap:14px}
.onb-hz{font:700 4.2rem/.9 "Barlow Condensed",sans-serif}
.onb-hz small{font-size:.35em;margin-left:4px;opacity:.7}
.onb-meter{position:relative;width:240px;height:36px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);overflow:hidden}
.ice .onb-meter{background:rgba(255,255,255,.6);border-color:#fff}
.onb-zone{position:absolute;left:42%;width:16%;top:0;bottom:0;background:rgba(80,200,130,.25)}
.onb-needle{position:absolute;top:4px;bottom:4px;width:8px;margin-left:-4px;border-radius:4px;background:#ff5b4f;animation:onbNeedle 2.4s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes onbNeedle{0%{left:12%;background:#ff5b4f}35%{left:78%;background:#ff5b4f}65%{left:44%}100%{left:50%;background:#36c97e}}
.onb-ok{font:700 1.3rem "Barlow Condensed",sans-serif;color:#36c97e;opacity:0;animation:onbPop .4s ease 2.2s forwards}
.onb-drum{height:230px;width:auto;animation:onbSpin 1s cubic-bezier(.16,1,.3,1)}
@keyframes onbSpin{from{transform:rotate(-40deg) scale(.7);opacity:0}}
.onb-list{width:min(320px,86vw);display:flex;flex-direction:column;gap:8px}
.onb-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);opacity:0;animation:onbRow .5s cubic-bezier(.16,1,.3,1) var(--d) forwards}
.ice .onb-row{background:rgba(255,255,255,.65);border-color:#fff}
.onb-row b{font-weight:600}
.onb-row span{font-size:.8rem;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
.ice .onb-row span{background:rgba(20,40,80,.08)}
@keyframes onbRow{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.onb-strings{display:flex;gap:8px}
.onb-strings span{width:44px;height:52px;border-radius:12px;display:grid;place-items:center;font:700 1.1rem "Barlow Condensed",sans-serif;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);animation:onbStr .5s ease var(--d) forwards}
.ice .onb-strings span{background:rgba(255,255,255,.7);border-color:#fff}
@keyframes onbStr{to{background:#2f9e5f;border-color:#5fd18f;color:#fff}}
.onb-faders{display:flex;gap:40px;height:190px}
.onb-fader{position:relative;width:8px;border-radius:4px;background:rgba(0,0,0,.6);box-shadow:inset 0 1px 2px #000}
.ice .onb-fader{background:rgba(20,30,50,.25)}
.onb-fader i{position:absolute;left:50%;width:34px;height:20px;margin-left:-17px;border-radius:3px;background:linear-gradient(180deg,#fff,#c9ced6 45%,#555 50%,#cfd3d9 55%,#fff);top:80%;animation:onbFader 1.6s cubic-bezier(.3,1.3,.5,1) var(--d) forwards}
.onb-fader.bus i{background:linear-gradient(180deg,#ffe58a,#f5b800 45%,#6b4f00 50%,#f2b400 55%,#ffe27a)}
.onb-fader.send i{background:linear-gradient(180deg,#a9cbff,#2f7bff 45%,#0d2a66 50%,#3a82ff 55%,#a3c7ff)}
.onb-fader.master i{background:linear-gradient(180deg,#ff9a8c,#ef2f1e 45%,#6a0f08 50%,#f0392a 55%,#ff9486)}
@keyframes onbFader{to{top:22%}}
.onb-share{display:flex;align-items:center;gap:22px}
.onb-phone{width:74px;height:132px;border-radius:16px;border:2px solid currentColor;display:grid;place-items:center;opacity:.9}
.onb-phone svg{width:34px;height:48px}
.onb-waves{display:flex;gap:6px}
.onb-waves i{width:10px;height:10px;border-radius:50%;background:var(--blue);opacity:.2;animation:onbWave 1.2s ease-in-out infinite}
.onb-waves i:nth-child(2){animation-delay:.2s}.onb-waves i:nth-child(3){animation-delay:.4s}
@keyframes onbWave{50%{opacity:1;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){#onb *{animation:none!important;opacity:1!important}.onb-logo *{stroke-dashoffset:0}}

/* ===== onboarding v2: manual, detailed ===== */
.onb-bars span.on i{animation:none}
.onb-bars span.done i{width:100%}
.onb-stage{align-items:flex-start;overflow-y:auto;cursor:default;padding:8px 2px 12px;-webkit-overflow-scrolling:touch}
.onb-slide{margin:auto;animation:none}
.onb-slide.in-r{animation:onbInR .45s cubic-bezier(.16,1,.3,1)}
.onb-slide.in-l{animation:onbInL .45s cubic-bezier(.16,1,.3,1)}
@keyframes onbInR{from{opacity:0;transform:translateX(40px)}}
@keyframes onbInL{from{opacity:0;transform:translateX(-40px)}}
.onb-art{height:200px}
.onb-slide h2{margin:18px 0 6px;font-size:1.55rem}
.onb-steps{text-align:left;margin:14px auto 0;padding:0;list-style:none;counter-reset:st;max-width:380px;display:flex;flex-direction:column;gap:8px}
.onb-steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:.92rem;line-height:1.4;opacity:.92}
.onb-steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 .8rem Barlow,sans-serif;background:var(--blue);color:#fff;margin-top:1px}
.onb-nav .btn:disabled{opacity:.35}
.onb-drum{height:200px!important}
.onb-tuner{gap:10px}
.onb-tlabel{font-size:.85rem;opacity:.7}
.onb-rec{grid-template-columns:1fr auto auto!important;row-gap:6px!important}
.onb-bar{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.ice .onb-bar{background:rgba(20,40,80,.1)}
.onb-bar em{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#A8382E,#D4887A 45%,#FAF7F4);background-size:calc(100% / var(--w)) 100%;animation:onbW 1s cubic-bezier(.16,1,.3,1) calc(var(--d) + .3s) forwards}
@keyframes onbW{to{width:calc(var(--w) * 100%)}}
.onb-photo{width:min(300px,84vw);height:auto;border-radius:14px;box-shadow:0 12px 26px rgba(0,0,0,.4)}
.onb-dot{opacity:0;transform-box:fill-box;transform-origin:center;animation:onbPop .4s cubic-bezier(.3,1.5,.5,1) var(--d) forwards}
.onb-sets,.onb-studio,.onb-share{flex-direction:column;gap:12px}
.onb-file{padding:8px 14px;border-radius:10px;border:1px dashed rgba(255,255,255,.3);font-size:.9rem;animation:onbPop .4s ease forwards}
.ice .onb-file{border-color:rgba(20,40,80,.3)}
.onb-card{width:min(320px,86vw);border-radius:14px;padding:8px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);text-align:left}
.ice .onb-card{background:rgba(255,255,255,.65);border-color:#fff}
.onb-field{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1);opacity:0;animation:onbRow .5s cubic-bezier(.16,1,.3,1) var(--d) forwards}
.onb-field:last-child{border-bottom:0}
.onb-field span{opacity:.6;font-size:.85rem}
.onb-field b{font-weight:600;font-size:.9rem;text-align:right}
.onb-chain{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.onb-studio .onb-faders{height:120px}
.onb-menu{width:min(300px,84vw);display:flex;flex-direction:column;gap:6px}
.onb-tour{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.ice .onb-tour{background:rgba(255,255,255,.7);border-color:#fff}
.onb-lines{font-size:1.3rem;animation:onbTap 1.2s ease .2s 1}
@keyframes onbTap{50%{transform:scale(1.4);color:var(--blue)}}
.onb-mi{padding:10px 14px;border-radius:999px;text-align:center;font-weight:600;font-size:.9rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);opacity:0;animation:onbRow .45s cubic-bezier(.16,1,.3,1) var(--d) forwards}
.ice .onb-mi{background:rgba(255,255,255,.7);border-color:#fff}
.onb-mi.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.onb-mi.del{background:#b84336;border-color:#b84336;color:#fff}
.onb-share .onb-waves{margin-top:4px}

.onb-art{height:auto!important;min-height:200px}
.onb-quick .drumsvg{width:210px!important;height:210px!important;max-width:none}
.onb-faders{gap:40px!important}
.onb-fader{background:rgba(255,255,255,.16)!important;box-shadow:none!important}
.ice .onb-fader{background:rgba(20,30,50,.22)!important}
.onb-reco .onb-list{gap:6px}

.sq-logo{width:76px;height:52px;flex:none;display:grid;place-items:center;border-radius:10px;overflow:hidden}
.sq-logo img{max-width:100%;max-height:100%;object-fit:contain}
.brand{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.brand-row{display:grid;grid-template-columns:5.5rem 1fr;gap:6px 10px;align-items:center}
.brand-l{font-size:.8rem;color:var(--muted);font-weight:500}
.brand-btns{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.brand-ph{color:var(--muted);font-size:.85rem;opacity:.8}
.brand-logo{height:56px;display:flex;align-items:center}
.brand-logo img{max-height:56px;max-width:180px;object-fit:contain;border-radius:6px}

.ly-scroll{background:#2a2d33;padding:16px 10px 60px!important}

.ss-sheetbtn.ly{background:#6b4fd6}

/* help: song edit mock */
.se-wrap{gap:8px!important;width:min(330px,88vw)!important}
.se-card{border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);overflow:hidden;text-align:left;transition:border-color .3s}
.ice .se-card{background:rgba(255,255,255,.75);border-color:#fff}
.se-card.open{border-color:var(--blue)}
.se-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.se-num{font:700 1.2rem "Barlow Condensed",sans-serif;color:var(--blue);min-width:1ch}
.se-t{flex:1;min-width:0;display:flex;flex-direction:column}
.se-t b{font:600 1.05rem Barlow,sans-serif}
.se-meta{font-size:.8rem;color:var(--muted);min-height:1em}
.se-chev{font-size:1.3rem;opacity:.6;transition:transform .3s}

.se-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.3,1,.4,1),padding .5s;padding:0 14px;display:flex;flex-direction:column;gap:8px}

.se-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.se-f{display:flex;flex-direction:column;gap:3px}
.se-f > span:first-child{font-size:.7rem;color:var(--muted)}
.se-in{position:relative;display:flex;align-items:center;min-height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line-strong);background:rgba(0,0,0,.25);font-size:.92rem;transition:border-color .2s,box-shadow .2s}

.se-in.sel::after{content:"▾";position:absolute;right:10px;opacity:.6}
.se-f.focus .se-in{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.se-f.focus .se-v::after{content:"";display:inline-block;width:1.5px;height:1em;margin-left:1px;background:var(--blue);vertical-align:-2px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.se-ph{color:var(--muted);opacity:.7}
.se-f.filled .se-ph{display:none}
.se-next{opacity:.6}
/* help: upload video mock */
.ch-wrap{width:min(340px,90vw)!important}
.ch-panel{width:100%;max-height:0;overflow:hidden;opacity:0;transition:max-height .6s cubic-bezier(.3,1,.4,1),opacity .4s;display:flex;flex-direction:column;gap:12px;text-align:left}
.ch-panel.open{max-height:420px;opacity:1}
.ch-sec{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.ice .ch-sec{background:rgba(255,255,255,.75);border-color:#fff}
.ch-sec > b{font-size:.85rem}
.ch-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch-btn{font:600 .78rem Barlow,sans-serif;padding:6px 10px;border-radius:999px;background:var(--blue);color:#fff}
.ch-file,.ch-res,.ch-photo,.ch-paper{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .4s cubic-bezier(.3,1.3,.4,1)}
.ch-file.show,.ch-res.show,.ch-photo.show,.ch-paper.show{opacity:1;transform:none}
.ch-file{font-size:.78rem;padding:4px 8px;border-radius:8px;border:1px dashed var(--line-strong)}
.ch-res{font-size:.78rem;color:#36c97e}
.ch-photo{width:40px;height:50px;border-radius:4px;background:#f3eedf;transform:rotate(-6deg) translateY(8px);display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 6px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.ch-photo.show{transform:rotate(-6deg)}
.ch-photo i{display:block;height:2px;border-radius:2px;background:#5a5a8a;opacity:.7}
.ch-photo i:nth-child(2){width:70%}.ch-photo i:nth-child(4){width:55%}
.ch-paper{background:#fff;color:#111;border-radius:4px;padding:8px 10px;font:500 .78rem/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif}
.ch-paper .pl{opacity:0;transition:opacity .25s}
.ch-paper .pl.show{opacity:1}
.ch-paper .h{font-weight:700}
.onb-art.onb-song{min-height:400px!important;align-items:flex-start!important}
.onb-art.onb-chords{min-height:430px!important;align-items:flex-start!important}

.iv-reco{margin:12px 0 4px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:6px}

.iv-pair{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;font-size:.9rem}
.iv-pair b{color:var(--accent);white-space:nowrap}
.iv-arr{opacity:.5}

.lvl{margin:14px 0 6px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.lvl-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.lvl-hd span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lvl-name{font:700 1.15rem "Barlow Condensed",sans-serif;color:var(--accent)}
.lvl-range{width:100%;accent-color:var(--accent)}
.lvl-scale{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-top:2px}
.lvl-scale span{flex:1;text-align:center}.lvl-scale span:first-child{text-align:left}.lvl-scale span:last-child{text-align:right}
.lvl-hint{font-size:.82rem;margin:8px 0 0}
.rec .iv.rg{opacity:.65;font-size:.78rem}

/* free tuner: instrument switch in the header */
.tun-switch{display:flex;gap:4px;margin-right:6px;flex:none}
.ts-btn{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.ts-btn .ico{width:22px;height:22px}
.ts-btn.on{color:var(--accent);border-color:var(--line-strong);background:rgba(255,255,255,.07)}
.ts-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* setlist: time signature select */
.s-ed-row .s-sig{flex:0 0 76px;min-width:0}
/* show mode: bpm chip opens click */
.ss-bpm{all:unset;cursor:pointer;font:700 clamp(1.3rem,6vw,1.9rem)/1 "Barlow Condensed",sans-serif;color:#d7dbe2;background:#121419;border:1px solid #3a4150;border-radius:10px;padding:6px 12px}
.ss-bpm:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sc-panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);z-index:25;background:#0d0f13;border:1px solid #2a2e36;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:shIn .25s cubic-bezier(.16,1,.3,1)}
.sc-hd{display:flex;justify-content:space-between;align-items:center}
.sc-hd b{font:700 1.2rem "Barlow Condensed",sans-serif}
.sc-close{all:unset;cursor:pointer;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:1.5rem;color:#ff4a3d;border:1.5px solid #e5352b;background:#1a0b0b}
.sc-tempo{display:flex;align-items:center;justify-content:center;gap:16px}
.sc-bpmbox{text-align:center;min-width:90px}
.sc-bpmv{font:700 3rem/1 "Barlow Condensed",sans-serif}
.sc-bpmbox small{display:block;color:#8f97a3;font-weight:600}
.sc-l{font:600 .72rem Barlow,sans-serif;color:#8f97a3;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.sc-panel .chips{gap:6px}
.sc-start{margin-top:6px;min-height:50px}
.sc-fab{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:24;display:flex;align-items:center;gap:6px}
.sc-play{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:999px;background:#16191f;border:1px solid #3a4150;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:background .1s}
.sc-ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--blue);font-size:.9rem}
.sc-fab.on .sc-ico{background:#e5352b}
.sc-bpm{font:700 1rem "Barlow Condensed",sans-serif}
.sc-x{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#9aa3af;background:#16191f;border:1px solid #2a2e36}
.sc-fab.b-acc .sc-play{animation:fabAcc .22s ease-out}
.sc-fab.b-beat .sc-play{animation:fabBeat .2s ease-out}
.sc-fab.b-sub .sc-play{animation:fabSub .14s ease-out}
@keyframes fabAcc{0%{background:#ff2a2a;box-shadow:0 0 30px 8px rgba(255,40,40,.6)}}
@keyframes fabBeat{0%{background:#f4f6ff;color:#111;box-shadow:0 0 26px 6px rgba(255,255,255,.45)}}
@keyframes fabSub{0%{background:#3a3f4a}}

.ss-click{display:inline-flex;align-items:stretch;border-radius:10px;border:1px solid #3a4150;background:#121419;overflow:hidden}
.ss-click .ss-bpm{border:0!important;border-radius:0!important;background:transparent!important;padding:6px 10px 6px 12px!important}
.ss-play{all:unset;cursor:pointer;display:grid;place-items:center;min-width:44px;padding:0 10px;font-size:1.05rem;color:#fff;background:var(--blue)}
.ss-click.on .ss-play{background:#e5352b}
.ss-click.on{border-color:#e5352b}
.ss-play:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.ss-click.b-acc{animation:clkAcc .22s ease-out}
.ss-click.b-beat{animation:clkBeat .2s ease-out}
.ss-click.b-sub{animation:clkSub .14s ease-out}
@keyframes clkAcc{0%{background:#ff2a2a;box-shadow:0 0 26px 6px rgba(255,40,40,.6)}}
@keyframes clkBeat{0%{background:#e8ecf5;box-shadow:0 0 22px 5px rgba(255,255,255,.4)}}
@keyframes clkSub{0%{background:#353b46}}
.ss-click.b-beat .ss-bpm{animation:clkTxt .2s ease-out}
@keyframes clkTxt{0%{color:#111}}

/* artist logo/image as background of the symbol boxes in tiles */
.has-artist-bg :is(.rc-ico,.at-ico){position:relative;overflow:hidden;isolation:isolate}
.has-artist-bg :is(.rc-ico,.at-ico)::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--artist-bg) center/cover no-repeat;transform:scale(1.02)}
.has-artist-bg :is(.rc-ico,.at-ico)::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.55))}
.has-artist-bg :is(.rc-ico,.at-ico) svg{color:#fff!important;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.has-artist-bg .mode.rowcard.locked .rc-ico::before{filter:grayscale(1)}

/* light theme: the bulb is a dark lamp housing, so every flash (incl. subdivisions) stays visible */
.ice .ck-bulb{--bulb:#0d121b;background:radial-gradient(circle at 50% 35%,#2a3242 0%,#121824 58%,#0a0e15 100%)!important;border:1px solid #0a0e15!important;box-shadow:inset 0 2px 10px rgba(255,255,255,.08),inset 0 -12px 26px rgba(0,0,0,.55),0 10px 26px rgba(20,30,50,.28)!important}
.ice .ck-bulb .ck-bpm{color:#f4f6fb}
.ice .ck-bulb .ck-bpm small{color:#9aa6ba}
.ck-bulb.f-sub::after{background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),rgba(190,205,235,.18) 70%,transparent)!important;box-shadow:0 0 18px 2px rgba(200,215,255,.25)}
@keyframes bulbOffSub{0%{opacity:.75}100%{opacity:0}}
.ice .ck-bulb.f-beat::after{box-shadow:0 0 40px 8px rgba(120,150,210,.45)}
.ice .ck-bulb.f-acc::after{box-shadow:0 0 50px 12px rgba(255,40,40,.5)}

/* click bulb v3: crisp, equally bright pulses; accents red; number fades out while running */
.ck-bulb .ck-bpm{transition:opacity .35s}
.ck-bulb.running .ck-bpm{opacity:.07}
.ck-bulb.f-beat .ck-bpm,.ck-bulb.f-acc .ck-bpm,.ck-bulb.f-sub .ck-bpm{animation:none!important}
.ck-bulb.f-beat::after,.ck-bulb.f-sub::after{background:#fff!important;box-shadow:0 0 44px 10px rgba(255,255,255,.6)!important;animation:bulbFlash .17s linear forwards!important}
.ck-bulb.f-acc::after{background:#ff1e1e!important;box-shadow:0 0 54px 14px rgba(255,30,30,.65)!important;animation:bulbFlash .17s linear forwards!important}
@keyframes bulbFlash{0%{opacity:1}40%{opacity:1}100%{opacity:0}}
.ice .ck-bulb.f-beat::after,.ice .ck-bulb.f-sub::after{box-shadow:0 0 44px 10px rgba(110,140,200,.55)!important}
/* show mode button: subdivisions as bright as beats */
.ss-click.b-sub{animation:clkBeat .2s ease-out!important}

.ss-lock{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;color:#9aa3af;border-right:1px solid #2a2e36;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}

.sheet-edit{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace!important;font-size:.85rem!important;white-space:pre;overflow-x:auto}

.ss-hside .ss-play:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.ss-meta.v2 .ss-bi{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:.8rem;line-height:1;background:linear-gradient(180deg,rgba(130,178,255,.8),rgba(64,112,222,.7));color:#fff}

ce : peau de frappe et de résonance"],"Resonanzfell":["Resonant head","Parche resonante","Peau de résonance"],"Resonanzfell 1,0 Halbtöne höher (Verhältnis 1,06)":["Resonant head 1.0 semitones higher (ratio 1.06)","Parche resonante 1,0 semitonos más agudo (relación 1,06)","Peau de résonance 1,0 demi-ton plus haut (rapport 1,06)"],"Richtwerte für den Grundton des Schlagfells, abgeleitet aus den Kesselgrößen. Jede Trommel klingt in einem gewissen Bereich gut, nimm die Werte als Startpunkt und stimm nach Gehör nach. Die Zielwerte erscheinen danach im Tuner.":["Guide values for the batter head’s fundamental, derived from shell sizes. Every drum sounds good within a range; use the values as a starting point and fine-tune by ear. The targets then appear in the tuner.","Valores orientativos para la fundamental del parche superior, según la medida del casco. Cada tambor suena bien en un rango; úsalos como punto de partida y ajusta de oído. Los objetivos aparecen después en el afinador.","Valeurs indicatives pour la fondamentale de la peau de frappe, selon la taille des fûts. Chaque fût sonne bien dans une plage ; utilise-les comme point de départ et affine à l’oreille. Les cibles apparaissent ensuite dans l’accordeur."],"Rot heißt anziehen oder lösen, grün liegt innerhalb von ±5 Cent. „Automatisch“ aus: eine Schraube mehrfach messen":["Red means tighten or loosen, green is within ±5 cents. “Auto” off: measure one lug several times","Rojo: apretar o aflojar, verde: dentro de ±5 cents. «Automático» desactivado: medir un afinador varias veces","Rouge : serrer ou desserrer, vert : dans ±5 cents. « Auto » désactivé : mesurer un tirant plusieurs fois"],"Roter DIP-Schalter: 48 V an oder aus":["Red DIP switch: 48 V on or off","Interruptor DIP rojo: 48 V encendido o apagado","Interrupteur DIP rouge : 48 V on ou off"],"Saite":["String","Cuerda","Corde"],"Saiten":["Strings","Cuerdas","Cordes"],"Saiten (Hersteller / Serie)":["Strings (brand / series)","Cuerdas (marca / serie)","Cordes ( /* Studio is temporarily locked on the public tester link (GitHub Pages). Unlock on a device with #studio-freigeben, lock again with #studio-sperren. */
function studioLocked() {
  try {
    if (location.hash === '#studio-freigeben') { localStorage.setItem('drumtech-dev', '1'); history.replaceState(null, '', location.pathname + location.search); }
    if (location.hash === '#studio-sperren') { localStorage.removeItem('drumtech-dev'); history.replaceState(null, '', location.pathname + location.search); }
    if (localStorage.getItem('drumtech-dev') === '1') return false;
  } catch (e) {}
  return /github\.io$/i.test(location.hostname);
}

const HEAD_CAT_NAME = { bd: 'Bassdrum', sn: 'Snare', tom: 'Tom' };
function titleWords(t) { return t.split(/\s+/).filter(Boolean).map(w => /[A-Z]/.test(w.slice(1)) ? w : w[0].toUpperCase() + w.slice(1)).join(' '); }
function learnHead(raw, cat, part) {
  const custom = S.customHeads ||= {};
  const brands = [...new Set([...Object.keys(HEADS), ...Object.keys(custom), ...HEAD_BRANDS_EXTRA])].sort((a, b) => b.length - a.length);
  const low = raw.toLowerCase();
  let brand = brands.find(b => low === b.toLowerCase() || low.startsWith(b.toLowerCase() + ' '));
  let type = brand ? raw.slice(brand.length).trim() : raw.split(/\s+/).slice(1).join(' ');
  if (!brand) { const first = raw.split(/\s+/)[0]; brand = first.length <= 3 ? first.toUpperCase() : titleWords(first); }
  if (!type) return raw;
  const all = [...Object.values(HEADS[brand] || {}).flatMap(c => [...c.bat, ...c.res]), ...Object.values(custom[brand] || {}).flatMap(c => [...(c.bat || []), ...(c.res || [])])];
  type = all.find(t => t.toLowerCase() === type.toLowerCase()) || titleWords(type);
  const known = [...(HEADS[brand]?.[cat]?.[part] || []), ...(custom[brand]?.[cat]?.[part] || [])];
  if (!known.some(t => t.toLowerCase() === type.toLowerCase())) {
    const slot = ((custom[brand] ||= {})[cat] ||= { bat: [], res: [] });
    (slot[part] ||= []).push(type);
    toast(`Zur Schnellauswahl hinzugefügt: ${brand} ${type}`);
  }
  return `${brand} ${type}`;
}

function onbArt(art) {

}
function runDemo(name, slideEl) {
  clearDemo();
  const steps = DEMOS[name] || [], lis = [...slideEl.querySelectorAll('.onb-steps li')], root = slideEl.querySelector('.onb-art > *');
  if (!lis.length) { steps.forEach((fn, k) => later(() => root && fn(root), 500 + k * 650)); return; }
  lis.forEach((li, k) => later(() => { li.classList.add('in'); if (steps[k] && root) steps[k](root); }, 700 + k * 2200));
}
function showHelp(slides) {

    const sl = slides[i];

      sl.title ? h('h2', {}, sl.title) : null, sl.text ? h('p', {}, sl.text) : null, onbArt(sl.art),
      sl.steps ? h('ul', { class: 'onb-steps' + (sl.demo ? ' scripted' : '') }, sl.steps.map((t, k) => typeof t === 'object' ? h('li', { class: 'ico', style: `--k:${k}` }, h('span', { class: 'step-ico', 'aria-hidden': 'true' }, t.icon === 'logo' ? logoSvg('', 34) : h('span', { class: 'help-q' }, '?')), h('span', {}, t.t)) : h('li', { style: `--k:${k}` }, t))) : null));

  ov.addEventListener('touchend', e => { const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dy) < Math.abs(dx) * .6 && Date.now() - st < 800) go(dx < 0 ? i + 1 : i - 1, dx < 0 ? 1 : -1); }, { passive: true });

}
