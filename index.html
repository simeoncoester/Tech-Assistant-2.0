<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Tech Assistent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --surface:#0F1217; --surface-2:#161B23; --field:#07090C; --line:#262D38; --line-strong:#3A4555;
  --ink:#F3F6FA; --muted:#8C97A8; --blue:#3B8BFF; --blue-hi:#B4C6DF; --blue-soft:rgba(59,139,255,.14);
  --green:#86B394; --green-soft:rgba(54,201,126,.16); --red:#CF7F72; --red-soft:rgba(255,91,79,.16);
  --tape:#F2F4F7; --tape-ink:#0B0D10;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(0,0,0,.88);backdrop-filter:blur(10px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:58px}
.bar .t{flex:1;min-width:0}
.bar h1{margin:0;font:600 1.3rem/1.1 "Barlow Condensed",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sub{font-size:.82rem;color:var(--blue-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:none;padding:6px 8px;margin-left:-6px;font:600 1.05rem "Barlow Condensed",sans-serif;cursor:pointer;color:var(--blue-hi)}

main{max-width:760px;margin:0 auto;padding:18px 14px 70px;min-height:calc(100vh - 60px)}
h2{font:700 1.3rem/1.15 "Barlow Condensed",sans-serif;margin:30px 0 10px}
h2 small{font:500 .95rem Barlow,sans-serif;color:var(--muted);margin-left:6px}
.muted{color:var(--muted)}
.foot{color:var(--muted);font-size:.85rem;margin-top:28px;max-width:60ch}

.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font:400 1.3rem/1.15 "Permanent Marker","Comic Sans MS",cursive;padding:8px 18px 7px;transform:rotate(-1.2deg);
  clip-path:polygon(0 6%,3% 0,40% 5%,97% 0,100% 8%,98% 52%,100% 94%,96% 100%,55% 95%,3% 100%,0 92%,2% 48%)}
.tape.big{font-size:1.9rem;padding:10px 22px 9px}
.tape.sm{font-size:1rem;padding:5px 12px 4px}
.tape.tilt{transform:rotate(1deg)}

/* square artist buttons */
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sq{all:unset;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;padding:16px;border-radius:22px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);position:relative;overflow:hidden}
.sq:hover{border-color:var(--blue)}
.sq:focus-visible{outline:2px solid var(--blue-hi);outline-offset:3px}
.sq-ini{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 1.3rem "Barlow Condensed",sans-serif}
.sq-name{font:700 1.35rem/1.1 "Barlow Condensed",sans-serif;word-break:break-word}
.sq-meta{font-size:.82rem;color:var(--muted)}
.sq.add{background:transparent;border:1.5px dashed var(--line-strong);justify-content:center;align-items:center;text-align:center;gap:6px}
.sq.add:hover{border-color:var(--blue)}
.sq-plus{font:300 2.6rem/1 Barlow,sans-serif;color:var(--blue-hi)}

.modes{display:grid;gap:14px}
.mode{all:unset;cursor:pointer;border-radius:22px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.mode::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;border:16px solid var(--blue-soft)}
.mode:hover{border-color:var(--blue)}
.mode:focus-visible{outline:2px solid var(--blue-hi);outline-offset:3px}
.mode b{font:700 2.4rem/1 "Barlow Condensed",sans-serif}
.mode span{color:var(--muted)}
.mode em{font-style:normal;color:var(--blue-hi);font-size:.9rem;font-weight:600}

.tiles{display:grid;gap:10px;margin-top:20px}
.tile{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tile:hover{border-color:var(--blue)}
.tile:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
.tile b{font:700 1.6rem/1 "Barlow Condensed",sans-serif}
.tile span{grid-column:1;color:var(--muted);font-size:.95rem}
.tile i{grid-row:1/3;grid-column:2;font-style:normal;font:600 1.6rem "Barlow Condensed",sans-serif;color:var(--blue-hi)}
.tile.primary{background:var(--blue);border-color:var(--blue)}
.tile.primary span,.tile.primary i{color:#fff;opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.list-item{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;position:relative}
.list-item::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--blue)}
.list-item:hover{border-color:var(--blue)}
.list-item:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
.list-item b{display:block;font:600 1.2rem/1.2 "Barlow Condensed",sans-serif}
.list-item span{color:var(--muted);font-size:.92rem}
.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:18px;color:var(--muted);text-align:center;margin-bottom:12px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px}
input::placeholder,textarea::placeholder{color:#566173}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.with-btn{display:flex;gap:6px}
.with-btn input{flex:1;min-width:0}

.btn{border:1px solid var(--ink);background:transparent;border-radius:10px;padding:9px 15px;font:600 1rem/1.1 "Barlow Condensed",sans-serif;letter-spacing:.02em;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--blue-hi);color:var(--blue-hi)}
.btn.solid{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.solid:hover{background:#2F7BEF;color:#fff}
.btn.ghost{border-color:var(--line-strong);color:var(--muted)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:6px 10px;min-height:36px;font-size:.95rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;min-width:0}
.x{border:1px solid var(--line);background:var(--field);border-radius:8px;width:40px;min-height:40px;cursor:pointer;color:var(--muted);font-size:1.05rem;flex:none}
.x:hover{color:var(--red);border-color:var(--red)}
.x.sm{width:32px;min-height:32px;font-size:.9rem}

.drum-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.mic-row{display:grid;grid-template-columns:1fr 1.3fr auto;gap:6px;margin-bottom:6px}

/* head picker */
.pick-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:42px;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}
.pick-btn:hover,.pick-btn[aria-expanded="true"]{border-color:var(--blue)}
.pick-btn .ph{color:#566173}
.pick-btn i{font-style:normal;color:var(--blue-hi);transition:transform .15s}
.pick-btn[aria-expanded="true"] i{transform:rotate(180deg)}
.pick-panel{margin-top:6px;border:1px solid var(--blue);border-radius:10px;background:var(--surface-2);padding:10px}
.pick-title{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.linkbtn{border:0;background:none;color:var(--blue-hi);cursor:pointer;padding:2px 0;font-weight:600}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.pick-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.pick-opt{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.pick-opt:hover,.pick-opt.on{border-color:var(--blue);background:var(--blue-soft)}
.pick-opt.brand{font:600 1.1rem "Barlow Condensed",sans-serif;text-align:center}

/* recording chain */
details.chain{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.chain[open]{border-color:var(--line-strong)}
details.chain summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
details.chain summary::-webkit-details-marker{display:none}
.ch-name{font:600 1.2rem "Barlow Condensed",sans-serif;display:flex;justify-content:space-between}
.ch-name::after{content:"+";color:var(--blue-hi)}
details[open] .ch-name::after{content:"–"}
.ch-sum{color:var(--blue-hi);font-size:.88rem}
.ch-body{padding:0 14px 14px}
.flow{display:flex;flex-direction:column;gap:0;margin-top:12px}
.stage-blk{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.flow .arrow{align-self:center;color:var(--blue);line-height:1;padding:4px 0;font-size:1.1rem}
.stage-hd{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.stage-hd .seg{order:5;flex-basis:100%;width:max-content;max-width:max-content}
.ch-body,.stage-blk,details.chain{min-width:0}
.stage-hd b{font:600 1.1rem "Barlow Condensed",sans-serif;flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:.82rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* setlists */
.song{display:grid;grid-template-columns:2rem 1fr 4.6rem auto;gap:6px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.song .no{font:700 1.3rem/42px "Barlow Condensed",sans-serif;color:var(--blue-hi);text-align:right}
.song .note{grid-column:2/4}
.song .ctrl{display:flex;flex-direction:column;gap:4px;grid-row:1/3;grid-column:4}
.song .ctrl button{width:38px;min-height:30px;border:1px solid var(--line);background:var(--field);border-radius:6px;cursor:pointer;color:var(--muted)}
.song .ctrl button:hover{color:var(--blue-hi);border-color:var(--blue)}
.stage{background:#000;color:#fff;position:fixed;inset:0;z-index:20;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 24px)}
.stage ol{margin:0;padding:0;list-style:none;counter-reset:s}
.stage li{counter-increment:s;display:flex;gap:14px;align-items:baseline;font:700 clamp(1.8rem,7vw,3.2rem)/1.15 "Barlow Condensed",sans-serif;padding:6px 0;border-bottom:1px solid #222}
.stage li::before{content:counter(s);color:var(--blue);min-width:1.6em;text-align:right}
.stage li small{display:block;font:500 1.05rem Barlow,sans-serif;color:#9aa}
.stage .close{position:sticky;top:0;float:right;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:700 1.05rem "Barlow Condensed",sans-serif;cursor:pointer}

/* tuner */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 10px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font:600 1.05rem "Barlow Condensed",sans-serif;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:#fff;box-shadow:inset 0 -2px 0 var(--blue)}
.readout{background:radial-gradient(120% 90% at 50% 0%,rgba(59,139,255,.16),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;text-align:center}
.hz{font:700 clamp(4rem,22vw,7rem)/.95 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 28px rgba(59,139,255,.55)}
.hz.stale{color:var(--muted);text-shadow:none}
.hz small{font-size:.3em;font-weight:600;margin-left:4px;color:var(--blue-hi);text-shadow:none}
.notename{font:600 1.1rem "Barlow Condensed",sans-serif;color:var(--muted);min-height:1.5em}
.meter{position:relative;height:44px;margin:14px 2px 6px;border-radius:10px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;left:42%;width:16%;background:var(--green-soft)}
.meter .center{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;opacity:.5}
.meter .needle{position:absolute;top:5px;bottom:5px;width:8px;margin-left:-4px;left:50%;border-radius:4px;background:var(--muted);transition:left .12s ease-out,background .12s}
.meter-labels{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);padding:0 4px}
.status{font:700 1.35rem/1.2 "Barlow Condensed",sans-serif;margin-top:8px;min-height:1.65rem}
.status.ok{color:var(--green)} .status.off{color:var(--red)}
canvas.spec{width:100%;height:120px;display:block;margin-top:12px;border-radius:10px;background:var(--field);border:1px solid var(--line)}
.hits{display:flex;gap:6px;flex-wrap:wrap;min-height:34px}
.hit{font:600 1rem "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.hit.ok{border-color:var(--green);color:var(--green)}
.mic-btn{width:100%;margin-top:12px;min-height:54px;font-size:1.25rem}
.err{color:var(--red);margin-top:8px}
input[type=range]{padding:0;min-height:auto;border:0;background:none;accent-color:var(--blue)}
.lugwrap{display:flex;justify-content:center;margin-top:8px}
.lugwrap svg{width:100%;max-width:340px;height:auto}
.lug{cursor:pointer}
.res-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);text-align:center}
.slot[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.slot b{display:block;font:700 2.2rem/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.slot span{font-size:.82rem;color:var(--muted)}
.slot em{font-style:normal;font-size:.8rem;color:var(--blue-hi)}
.interval{text-align:center;margin-top:12px;font:600 1.15rem "Barlow Condensed",sans-serif}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(120px);background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-weight:600;transition:transform .2s,visibility .2s;z-index:30;max-width:90vw;visibility:hidden}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
@media (prefers-reduced-motion:reduce){.meter .needle,#toast,.pick-btn i{transition:none}}
@media (max-width:420px){.grid{grid-template-columns:1fr}.mic-row{grid-template-columns:1fr 1fr auto}}

/* ===== 3D finish ===== */
input,select,textarea{box-shadow:inset 0 2px 5px rgba(0,0,0,.65)}
.card{background:linear-gradient(180deg,#12161d,#0b0e13);border-color:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 26px rgba(0,0,0,.55)}
.btn{background:linear-gradient(180deg,#262e3a 0%,#141920 100%);border:1px solid rgba(255,255,255,.1);color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.45),0 1px 0 #000,0 6px 16px rgba(0,0,0,.55);
  text-shadow:0 1px 0 rgba(0,0,0,.6);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.15);color:#fff;border-color:rgba(141,187,255,.4)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 #000}
.btn.solid,.btn.solid:hover{background:linear-gradient(180deg,#78B0FF 0%,#3B8BFF 45%,#1C58C6 100%);border-color:#86B9FF;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,10,60,.35),0 1px 0 #000,0 8px 22px rgba(59,139,255,.38)}
.btn.solid:active{box-shadow:inset 0 2px 8px rgba(0,10,60,.5),0 1px 0 #000}
.btn.ghost{color:var(--muted)}
.btn.danger.armed{background:linear-gradient(180deg,#ff8a80,#cf3328);border-color:#ff9a90;color:#fff}
.tile,.sq,.mode,.list-item,.slot{background:linear-gradient(165deg,#1d2430 0%,#0d1117 72%);border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.6),0 2px 0 #000,0 16px 32px rgba(0,0,0,.65);transition:transform .12s,box-shadow .12s,border-color .15s}
.tile:hover,.sq:hover,.mode:hover,.list-item:hover{border-color:rgba(141,187,255,.5)}
.tile:active,.sq:active,.mode:active,.list-item:active{transform:translateY(2px) scale(.995);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 #000,0 4px 10px rgba(0,0,0,.6)}
.tile.primary{background:linear-gradient(165deg,#78B0FF 0%,#3B8BFF 42%,#1A50B5 100%);border-color:#86B9FF;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 #000,0 18px 36px rgba(59,139,255,.35)}
.sq::before,.mode::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 42%);pointer-events:none}
.sq-ini{background:linear-gradient(180deg,#78B0FF,#1F5DCC);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(59,139,255,.4)}
.sq.add{background:transparent;box-shadow:none}
.chip{background:linear-gradient(180deg,#202733,#12161c);border-color:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 8px rgba(0,0,0,.5)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#78B0FF,#2563D6);border-color:#86B9FF;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px rgba(59,139,255,.35)}
.tabs{box-shadow:inset 0 2px 8px rgba(0,0,0,.8)}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#2a3446,#161b24);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 var(--blue),0 3px 8px rgba(0,0,0,.6)}
.pick-btn,.pick-opt,.x,.song .ctrl button{background:linear-gradient(180deg,#1c222c,#0e1218);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 6px rgba(0,0,0,.5)}
.pick-opt.on{background:linear-gradient(180deg,#244a85,#15315c);border-color:var(--blue)}
.readout{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 34px rgba(0,0,0,.6)}
.mode .ico{width:46px;height:46px;color:var(--blue-hi);margin-bottom:auto;filter:drop-shadow(0 4px 10px rgba(59,139,255,.4))}
.mode{min-height:170px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(60% 45% at 50% 42%,rgba(59,139,255,.22),transparent 70%),#000;display:grid;place-items:center;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-inner{text-align:center}
.sp-logo{width:min(46vw,190px);height:auto;filter:drop-shadow(0 0 26px rgba(59,139,255,.45))}
.sp-ring{stroke-dasharray:491;stroke-dashoffset:491;animation:spDraw 1.1s .15s cubic-bezier(.6,0,.2,1) forwards}
.sp-lugs rect{opacity:0;animation:spFade .3s forwards}
.sp-lugs rect:nth-child(1){animation-delay:.85s}.sp-lugs rect:nth-child(2){animation-delay:.92s}.sp-lugs rect:nth-child(3){animation-delay:.99s}.sp-lugs rect:nth-child(4){animation-delay:1.06s}
.sp-lugs rect:nth-child(5){animation-delay:1.13s}.sp-lugs rect:nth-child(6){animation-delay:1.2s}.sp-lugs rect:nth-child(7){animation-delay:1.27s}.sp-lugs rect:nth-child(8){animation-delay:1.34s}
.sp-wave{stroke-dasharray:300;stroke-dashoffset:300;animation:spDraw .8s 1.2s ease-out forwards}
.sp-word{font:700 clamp(2.3rem,11vw,3.4rem)/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;margin-top:20px;opacity:0;transform:translateY(8px);animation:spUp .6s 1.5s forwards;background:linear-gradient(180deg,#fff 30%,#a9bbd4);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-tag{color:var(--blue-hi);margin-top:8px;opacity:0;animation:spUp .6s 1.8s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}} @keyframes spFade{to{opacity:1}} @keyframes spUp{to{opacity:1;transform:none}}
/* drum graphic + string tuner */
.drumwrap{display:flex;justify-content:center;margin:8px 0}
.drumsvg{width:100%;max-width:380px;height:auto;filter:drop-shadow(0 20px 30px rgba(0,0,0,.75))}
.drumsvg .lug{cursor:pointer}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.strings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.str{min-width:52px;min-height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#262e3a,#141920);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 4px 10px rgba(0,0,0,.5);font:700 1.15rem "Barlow Condensed",sans-serif;cursor:pointer;color:var(--ink)}
.str[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 3px var(--blue-soft)}
.str.near{border-color:var(--blue);color:var(--blue-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 14px rgba(59,139,255,.45)}
.str.hot{background:linear-gradient(180deg,#A9CDB3,#1d8a54);color:#fff;border-color:#74e7ad}
.bignote{font:700 clamp(4.5rem,26vw,8rem)/.9 "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 0 30px rgba(59,139,255,.55)}
.bignote.stale{color:var(--muted);text-shadow:none}
.capo{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue-hi);font-weight:600;font-size:.9rem}
.str-row{display:grid;grid-template-columns:6.5rem 1fr;gap:10px;align-items:center;margin-bottom:8px}
.str-no{color:var(--muted);font-weight:500}
.song .tun{grid-column:2/4;display:grid;grid-template-columns:1fr 6.5rem;gap:6px}
.mic-card{padding:10px}
.song .keyrow{grid-column:2/4;display:grid;grid-template-columns:1fr auto auto;gap:6px}
.sheet-ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#171d27,#0b0e13);border:1px solid rgba(255,255,255,.1);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -20px 50px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line-strong);margin:2px auto 12px}
.sheet h3{margin:0;font:700 1.5rem/1.1 "Barlow Condensed",sans-serif}
.sheet .lead{color:var(--blue-hi);margin:4px 0 12px;font-size:.92rem}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--field);border:1px solid var(--line);margin-bottom:8px}
.rec.anchor{border-color:var(--blue)}
.rec .nm{font:600 1.1rem "Barlow Condensed",sans-serif}
.rec .nt{grid-row:1/3;grid-column:2;text-align:right;font:700 1.9rem/1 "Barlow Condensed",sans-serif;color:#fff}
.rec .nt small{display:block;font:500 .82rem Barlow,sans-serif;color:var(--blue-hi);margin-top:3px}
.rec .iv{color:var(--muted);font-size:.85rem}
.rec .fbar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.rec .fbar{height:8px;border-radius:4px;background:#0a0c10;border:1px solid var(--line)}
.rec .fbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#E0322A 0%,#FF7A62 45%,#FFD9D2 75%,#FFFFFF 100%);box-shadow:0 0 10px rgba(255,90,70,.35)}
.rec .cp{color:var(--blue-hi);font-weight:600}
.legend{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin:2px 0 8px}
.legend i{flex:0 0 90px;height:6px;border-radius:3px;background:linear-gradient(90deg,#E0322A,#FF7A62 45%,#fff)}
/* ===== area colours + navigation ===== */
:root{--accent:#3B8BFF}
.bar{border-bottom:2px solid color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 8px 20px -12px color-mix(in srgb,var(--accent) 60%,transparent)}
.back{color:var(--accent)}
.crumbs{display:flex;gap:2px;align-items:center;font-size:.8rem;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{all:unset;cursor:pointer;color:var(--accent);font-weight:600;padding:1px 2px;border-radius:4px}
.crumbs button:focus-visible{outline:2px solid var(--accent)}
.crumbs span{color:var(--muted);padding:0 2px}
main h2{position:relative;padding-left:12px}
main h2::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:4px;border-radius:2px;background:var(--accent)}
.list-item::before{background:var(--accent)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.atile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:138px;padding:16px;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,#161b23) 0%,#0d1117 78%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #000,0 14px 30px rgba(0,0,0,.6);transition:transform .12s,box-shadow .12s}
.atile:active{transform:translateY(2px) scale(.99)}
.atile:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.atile::after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 35%,transparent),transparent 70%)}
.at-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 75%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px color-mix(in srgb,var(--c) 45%,transparent)}
.at-ico svg{width:24px;height:24px}
.atile b{display:block;font:700 1.35rem/1.05 "Barlow Condensed",sans-serif}
.atile small{display:block;color:var(--muted);font-size:.84rem;margin-top:3px}
.mode.colored{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#161b23),#0d1117 75%)}
.mode.colored::after{border-color:color-mix(in srgb,var(--c) 20%,transparent)}
.mode.colored .ico,.mode.colored em{color:var(--c)}
.mode .ico.sm{width:40px;height:40px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(6,8,11,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
#tabbar[hidden]{display:none}
#tabbar button{all:unset;cursor:pointer;flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:12px;color:var(--muted);font:600 .7rem Barlow,sans-serif}
#tabbar button svg{width:24px;height:24px}
#tabbar button[aria-current="page"]{color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
#tabbar button:focus-visible{outline:2px solid var(--c)}
body.has-tabs main{padding-bottom:120px}
body.has-tabs #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
.avg{font:600 1.05rem "Barlow Condensed",sans-serif;margin:4px 0 10px}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}} @keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-ov{animation:none}}
.song .ai{grid-column:1/-1;margin-top:6px;background:linear-gradient(180deg,#141a24,#0b0e13);border:1px solid var(--line-strong);border-radius:14px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.ai-hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ai-meta{font:600 1.1rem "Barlow Condensed",sans-serif;color:var(--blue-hi);margin:12px 0 8px}
.ai-secs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ai-sec{display:grid;grid-template-columns:6.5rem 1fr;gap:2px 10px;padding:9px 11px;border-radius:10px;background:var(--field);border:1px solid var(--line)}
.ai-sec b{font:600 1.02rem "Barlow Condensed",sans-serif;color:var(--muted)}
.ai-ch{font:600 1.12rem "Barlow Condensed",sans-serif;color:#fff;letter-spacing:.02em;word-break:break-word}
.ai-sec small{grid-column:2;color:var(--muted)}
.ai-tip{font-size:.92rem;margin:10px 0 0}
.ai-note{color:var(--muted);font-size:.78rem;margin:8px 0 0}
.pick-group{font:600 .78rem Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-hi);margin:8px 2px 2px}
.pick-group:first-child{margin-top:0}
@media (prefers-reduced-motion:reduce){.sp-ring,.sp-wave{animation:none;stroke-dashoffset:0}.sp-lugs rect,.sp-word,.sp-tag{animation:none;opacity:1;transform:none}.pulse{animation:none}.btn,.tile,.sq,.mode,.list-item{transition:none}}

/* ===== refined, quieter palette ===== */
:root{--blue:#5D84BD;--blue-hi:#B4C6DF;--blue-soft:rgba(93,132,189,.16);--green:#86B394;--green-soft:rgba(134,179,148,.14);--red:#CF7F72;--red-soft:rgba(207,127,114,.14);--accent:#88A3C4}
.bar{border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:none}
.hz,.bignote{text-shadow:none}
.readout{background:linear-gradient(180deg,#15181d,#0d0f13);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 24px rgba(0,0,0,.5)}
input,select,textarea{box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.btn{background:linear-gradient(180deg,#1f242c,#14171c);border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 #000,0 4px 10px rgba(0,0,0,.45);text-shadow:none}
.btn:hover{filter:none;border-color:rgba(255,255,255,.24);color:#fff}
.btn.solid,.btn.solid:hover,.tile.primary{background:linear-gradient(180deg,#6788B8,#4B6B9B);border-color:#7895C0;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 0 #000,0 4px 12px rgba(0,0,0,.45)}
.btn.danger.armed{background:linear-gradient(180deg,#B9685C,#8E4A40);border-color:#C47A6E}
.chip{background:#14171c;box-shadow:none;border-color:rgba(255,255,255,.12)}
.chip[aria-pressed="true"]{background:#273241;border-color:#6F8DB8;color:#E6ECF5;box-shadow:none}
.tabs{box-shadow:inset 0 1px 4px rgba(0,0,0,.6)}
.tabs button[aria-selected="true"]{background:#1d222a;box-shadow:inset 0 -2px 0 var(--accent)}
.pick-btn,.pick-opt,.x,.song .ctrl button{background:#14171c;box-shadow:none}
.pick-opt.on{background:#222b38;border-color:#6F8DB8}
.pick-panel{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:#121418}
.card,.song .ai{background:#101216;box-shadow:none;border-color:rgba(255,255,255,.07)}
.sq,.mode,.list-item,.slot,.tile,.atile,.mode.colored{background:linear-gradient(180deg,#15181d,#0f1115);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 20px rgba(0,0,0,.45)}
.sq::before,.mode::before,.mode::after,.atile::after{display:none}
.sq:hover,.mode:hover,.list-item:hover,.atile:hover{border-color:rgba(255,255,255,.18)}
.sq-ini{background:#20262f;color:var(--blue-hi);box-shadow:none;border:1px solid rgba(255,255,255,.08)}
.sq.add{background:transparent;box-shadow:none;border:1px dashed rgba(255,255,255,.18)}
.mode.colored{border-left:3px solid color-mix(in srgb,var(--c) 75%,transparent)}
.mode.colored:hover{border-color:rgba(255,255,255,.18);border-left-color:var(--c)}
.mode .ico{filter:none}
.mode b{font-size:2.1rem}
.atile{min-height:120px;border-top:2px solid color-mix(in srgb,var(--c) 70%,transparent)}
.atile:hover{border-top-color:var(--c)}
.at-ico{width:40px;height:40px;border-radius:11px;background:transparent;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);box-shadow:none}
.at-ico svg{width:22px;height:22px}
.atile b{font-size:1.28rem}
#tabbar{background:rgba(5,6,8,.96)}
#tabbar button[aria-current="page"]{background:transparent;color:var(--c);box-shadow:inset 0 2px 0 var(--c);border-radius:0 0 10px 10px}
.str{background:#171a20;box-shadow:none}
.str.hot{background:#3E5E48;border-color:var(--green);color:#EAF3EC}
.str.near{box-shadow:none;border-color:#6F8DB8;color:var(--blue-hi)}
.slot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue-soft)}
.sheet{background:#111317;box-shadow:0 -16px 40px rgba(0,0,0,.7)}
.rec{background:#0c0e11}
.rec .fbar i{background:linear-gradient(90deg,#A8382E 0%,#D4887A 45%,#EFDCD4 78%,#FAF7F4 100%);box-shadow:none}
.legend i{background:linear-gradient(90deg,#A8382E,#D4887A 45%,#FAF7F4)}
#splash{background:#000}
.sp-logo{filter:none}
.sp-word{background:linear-gradient(180deg,#F4F2EE 30%,#B9C0C9);-webkit-background-clip:text;background-clip:text}
.drumsvg{filter:drop-shadow(0 14px 22px rgba(0,0,0,.7))}
.capo{background:rgba(136,163,196,.12)}


/* ===== mixing console ===== */
.console-wrap{margin:4px -14px 0;overflow-x:auto;padding:4px 14px 14px;-webkit-overflow-scrolling:touch}
.console{display:inline-flex;align-items:stretch;background:linear-gradient(180deg,#1c1f24,#121418);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 30px rgba(0,0,0,.6)}
.strip{width:74px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 5px 6px;border-right:1px solid rgba(0,0,0,.65);box-shadow:1px 0 0 rgba(255,255,255,.035);transition:opacity .15s}
.strip:last-child{border-right:0;box-shadow:none}
.strip.bus{background:transparent}
.strip.master{width:84px;background:rgba(255,255,255,.035);border-radius:0 8px 8px 0}
.strip.dim{opacity:.4}
.console .sep{width:8px;flex:none}
.ins{width:100%;height:20px;border-radius:4px;background:#0a0b0e;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:3px;padding:0 4px;font:600 10px/1 "Barlow Condensed",sans-serif;overflow:hidden;white-space:nowrap}
.ins i{font-style:normal;color:var(--k);letter-spacing:.04em;flex:none}
.ins span{color:#cfd6df;overflow:hidden;text-overflow:ellipsis}
.ins.empty{opacity:.3}
.knob-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 9px "Barlow Condensed",sans-serif;color:var(--muted);letter-spacing:.1em}
.knob{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4c535e,#1c1f25 70%);box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18);position:relative;touch-action:none;cursor:ns-resize}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:11px;margin-left:-1px;border-radius:1px;background:var(--kc,#ECE6DA);transform-origin:50% 14px;transform:rotate(var(--a,0deg))}
.knob.ro{cursor:default}
.knob:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kval{color:#d9dee6;font-size:10px;letter-spacing:0;font-variant-numeric:tabular-nums}
.ms{display:flex;gap:4px}
.ms button{width:27px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.1);background:#16191e;font:700 10px "Barlow Condensed",sans-serif;color:var(--muted);cursor:pointer}
.ms button.m[aria-pressed="true"]{background:#8E4A40;color:#fff;border-color:#C47A6E}
.ms button.s[aria-pressed="true"]{background:#C4A36E;color:#1a1408;border-color:#d9bd8e}
.dbv{font:600 11px "Barlow Condensed",sans-serif;color:#e9edf3;font-variant-numeric:tabular-nums;background:#0a0b0e;border-radius:3px;padding:2px 5px;min-width:42px;text-align:center}
.fader{position:relative;width:100%;height:210px;touch-action:none;cursor:ns-resize;border-radius:4px}
.fader:focus-visible{outline:2px solid var(--accent)}
.fader .slot{position:absolute;left:58%;top:6px;bottom:6px;width:4px;margin-left:-2px;border-radius:2px;background:#040506;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.05)}
.fader .tick{position:absolute;left:32%;right:16%;height:1px;background:rgba(255,255,255,.09)}
.fader .tick b{position:absolute;left:-20px;top:-6px;width:18px;text-align:right;font:500 8.5px "Barlow Condensed",sans-serif;color:#6c7480}
.fader .tick.zero{background:rgba(255,255,255,.22)}
.fader .cap{position:absolute;left:58%;width:34px;height:22px;margin:-11px 0 0 -17px;border-radius:3px;pointer-events:none;
  background:linear-gradient(180deg,#ece9e3 0%,#c2bdb3 44%,#6f6b64 50%,#c9c4ba 56%,#efece6 100%);box-shadow:0 4px 8px rgba(0,0,0,.65)}
.strip.bus .cap{background:linear-gradient(180deg,#f6e7b0 0%,#dcb658 44%,#6e5820 50%,#dfba5e 56%,#f8ebbb 100%)}
.strip.send .cap{background:linear-gradient(180deg,#d3e2f8 0%,#7ea0d2 44%,#2f4a75 50%,#82a4d6 56%,#d9e6fa 100%)}
.console .ins.empty{margin:0!important;padding:0!important;border:1px solid rgba(255,255,255,.06)!important;background:#0a0b0e!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:4px!important;text-align:left}
.fader .slot{width:4px!important;padding:0!important;border:0!important;border-radius:2px!important;background:#040506!important;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.05)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.strip.master .cap{background:linear-gradient(180deg,#e9b3aa 0%,#c27b70 44%,#6e3a33 50%,#c47f74 56%,#ecbcb3 100%)}
.scribble{width:100%;background:var(--tape);color:var(--tape-ink);font:400 12.5px/1.1 "Permanent Marker","Comic Sans MS",cursive;text-align:center;padding:5px 3px 4px;transform:rotate(-1.5deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;cursor:pointer;
  clip-path:polygon(0 8%,4% 0,50% 6%,96% 0,100% 10%,98% 50%,100% 92%,95% 100%,50% 94%,4% 100%,0 90%,2% 50%)}
.strip:nth-child(even) .scribble{transform:rotate(1.2deg)}
.src{font-size:9px;color:var(--muted);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}


/* ===== kit photo ===== */
.kp-wrap{position:relative;width:fit-content;max-width:100%;margin:0 auto;border-radius:14px;overflow:visible;user-select:none;-webkit-user-select:none}
.kp-wrap img{display:block;max-width:100%;max-height:62vh;border-radius:14px;border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 28px rgba(0,0,0,.6)}
.kp-tuner .kp-wrap img{max-height:36vh}
.kp-wrap.edit{cursor:crosshair}
.kp-wrap.edit img{outline:2px dashed color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px}
.kp-mark{all:unset;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;z-index:2}
.kp-mark:focus-visible .kp-dot{outline:2px solid #fff;outline-offset:2px}
.kp-dot{width:22px;height:22px;border-radius:50%;background:var(--pc);border:3px solid rgba(0,0,0,.55);box-shadow:0 0 0 2px var(--pc),0 4px 10px rgba(0,0,0,.6)}

/* DIP switch (phantom power) */
.dip-wrap{display:flex;align-items:center;gap:10px;min-height:42px}
.dip-tag{font:700 .78rem "Barlow Condensed",sans-serif;letter-spacing:.08em;color:var(--muted)}

/* metal toggle (polarity) */
.tgl{all:unset;cursor:pointer;position:relative;width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,#1b1d21 0 46%,#3a3e45 47% 60%,transparent 61%)}

.tgl-nut{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f6f8,#9aa1aa 55%,#5d636b);box-shadow:0 1px 3px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.12)}
.tgl-lever{position:absolute;left:50%;top:50%;width:7px;height:21px;margin-left:-3.5px;border-radius:4px 4px 3px 3px;transform-origin:50% 0;transform:rotate(12deg);
  background:linear-gradient(90deg,#7c838c,#f2f4f7 45%,#a3aab3 70%,#6a7078);box-shadow:0 2px 3px rgba(0,0,0,.55);transition:transform .14s ease}
.tgl-lever::after{content:"";position:absolute;left:50%;bottom:-3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#b5bcc4 55%,#6d737b);box-shadow:0 1px 2px rgba(0,0,0,.5)}

/* artist selection: wide cards stacked */
.sq-grid{grid-template-columns:1fr;gap:12px}
.sq{box-sizing:border-box;aspect-ratio:auto;min-height:84px;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;padding:16px 20px;border-radius:18px}

@keyframes slideInR{from{transform:translateX(-44px);opacity:0}}
